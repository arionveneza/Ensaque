name: Testar e publicar

# Publica o TSI no GitHub Pages. A pilha é só GitHub + Supabase:
# o GitHub guarda o código e serve o app, o Supabase guarda os dados.
#
# Configuração necessária: apenas Settings → Pages → Source: "GitHub Actions".
#
# Os valores do Supabase estão abaixo, em texto claro, de propósito. A chave
# `anon` é PÚBLICA por natureza: ela vai dentro do bundle que qualquer pessoa
# baixa ao abrir o site, em qualquer hospedagem. Guardá-la num secret não
# esconderia nada de ninguém. Quem protege os dados é o RLS no banco, que
# bloqueia tudo para quem não tem registro em `tsi.usuarios`.
#
# Se um dia cadastrar os secrets de mesmo nome, eles têm precedência — útil
# para apontar um build para outro projeto Supabase sem mexer no código.
#
# NUNCA coloque aqui a chave `service_role`: ela ignora todo o RLS.

on:
  push:
    branches: [main]
  # permite publicar manualmente pela aba Actions
  workflow_dispatch:

# só o necessário para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; não cancela o que já está publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    name: Testes e verificação de tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # os testes rodam ANTES do build: teste vermelho não vira deploy
      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

  publicar:
    name: Build e publicação
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # project site fica em /<repo>/ — sem isso os assets dão 404
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ztwmrhfloelqxhhpdmoz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0d21yaGZsb2VscXhoaHBkbW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDc0MDEsImV4cCI6MjEwMDgyMzQwMX0.zKMPGKFMY5RU7o_BihOcZqChfNXX-B4Hi8IuF9nYuo8' }}
        run: npm run build

      # o Pages não tem regra de rewrite: servir o index como 404 evita
      # tela em branco se alguém abrir um endereço que não existe
      - name: Fallback de rota
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
