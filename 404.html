<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSI mudou de endereço</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ensaque.arion-pereira.workers.dev/">
<!--
  Este endereço não serve mais o app: ele ficou parado num build antigo
  durante o incidente de Actions/Pages de 06/08/2026, e quem abrisse por
  aqui trabalharia na versão errada sem perceber. O TSI agora é publicado
  na Cloudflare, direto do mesmo repositório.

  A espera de 4 segundos é de propósito: um redirecionamento instantâneo
  levaria a pessoa ao lugar certo mas ela nunca leria o aviso, e o favorito
  errado continuaria no tablet para sempre.
-->
<meta http-equiv="refresh" content="4; url=https://ensaque.arion-pereira.workers.dev/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fafaf9; color: #1c1917;
  }
  .cartao {
    width: 100%; max-width: 30rem; padding: 2rem 1.75rem;
    background: #fff; border: 1px solid #e7e5e4; border-radius: 0.75rem;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
  }
  .marca { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #78716c; }
  h1 { margin: 0.4rem 0 0.75rem; font-size: 1.4rem; line-height: 1.25; }
  p { margin: 0 0 1rem; line-height: 1.55; color: #44403c; }
  .endereco {
    display: block; margin-bottom: 1.25rem; padding: 0.7rem 0.85rem;
    background: #f5f5f4; border-radius: 0.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem; word-break: break-all; color: #1c1917;
  }
  .botao {
    display: inline-block; padding: 0.7rem 1.4rem; border-radius: 0.5rem;
    background: #15803d; color: #fff; font-weight: 600; text-decoration: none;
  }
  .botao:hover { background: #166534; }
  .rodape { margin: 1.25rem 0 0; font-size: 0.8rem; color: #78716c; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #f5f5f4; }
    .cartao { background: #292524; border-color: #44403c; }
    p { color: #d6d3d1; }
    .endereco { background: #1c1917; color: #f5f5f4; }
    .marca, .rodape { color: #a8a29e; }
  }
</style>
</head>
<body>
  <main class="cartao">
    <p class="marca">Sementes Veneza</p>
    <h1>O TSI mudou de endereço</h1>
    <p>
      Este endereço foi desativado e mostra uma versão antiga do sistema.
      O endereço novo é:
    </p>
    <code class="endereco">ensaque.arion-pereira.workers.dev</code>
    <p>
      <a class="botao" href="https://ensaque.arion-pereira.workers.dev/">Abrir o TSI</a>
    </p>
    <p class="rodape">
      Você será levado automaticamente em alguns segundos.
      <strong>Atualize o favorito</strong> deste tablet ou computador para não voltar aqui.
    </p>
  </main>
</body>
</html>
