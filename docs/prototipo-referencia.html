<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSI 2025 — Controle de Tratamento de Sementes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --verde:#0e8a4f; --verde-esc:#0a6b3d; --verde-900:#07341f; --verde-cl:#e7f6ee;
  --fundo:#f2f5f7; --superficie:#ffffff; --borda:#e4e9ee; --borda-forte:#d3dae2;
  --txt:#17222b; --txt2:#64748b;
  --vermelho:#dc3d2f; --verm-cl:#fdeceb;
  --amarelo:#b7791f; --amar-cl:#fdf3e0;
  --azul:#1f6fd6; --azul-cl:#e9f1fc;
  --roxo:#6a3d9a;
  --sombra:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sombra-2:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.05);
  --raio:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:14px/1.5 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--txt);background:var(--fundo);-webkit-font-smoothing:antialiased}

/* ---------- header ---------- */
header{background:linear-gradient(135deg,var(--verde-900) 0%,var(--verde-esc) 55%,var(--verde) 100%);
  color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(7,52,31,.25)}
header .logo{font-weight:800;font-size:17px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
header .logo::before{content:'';width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:rgba(255,255,255,.16) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 2C7 6 4 10 4 14a8 8 0 0 0 16 0c0-4-3-8-8-12zm0 18a6 6 0 0 1-6-6c0-2.8 2-6 6-9.7 4 3.7 6 6.9 6 9.7a6 6 0 0 1-6 6z"/><path d="M12 7c-2.7 2.6-4 4.9-4 7a4 4 0 0 0 8 0c0-2.1-1.3-4.4-4-7z"/></svg>') center/18px no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
header .sub{font-size:11px;opacity:.75;font-weight:500;margin-top:1px}
header .spacer{flex:1}
header .dia{background:rgba(255,255,255,.13);padding:7px 14px;border-radius:9px;font-size:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
header label{font-size:11px;opacity:.9;display:flex;align-items:center;gap:7px;font-weight:600}
header select{padding:7px 10px;border-radius:8px;border:0;font-size:12px;font-weight:700;
  color:var(--verde-900);background:#fff;cursor:pointer;box-shadow:var(--sombra)}

/* ---------- nav ---------- */
nav{background:var(--superficie);border-bottom:1px solid var(--borda);display:flex;gap:4px;
  padding:8px 16px 0;overflow-x:auto;position:sticky;top:0;z-index:30;box-shadow:var(--sombra)}
nav button{background:none;border:0;padding:10px 16px 13px;font:600 13px/1 'Inter',sans-serif;
  color:var(--txt2);cursor:pointer;border-radius:9px 9px 0 0;white-space:nowrap;position:relative;
  transition:color .15s,background .15s}
nav button:hover{color:var(--txt);background:var(--fundo)}
nav button.on{color:var(--verde-esc)}
nav button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;
  border-radius:3px 3px 0 0;background:var(--verde)}
nav button .badge{background:var(--vermelho);color:#fff;border-radius:10px;padding:2px 7px;
  font-size:10px;margin-left:6px;font-weight:700}

main{padding:22px;max-width:1520px;margin:0 auto}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
h3{font-size:14px;font-weight:700;margin-bottom:10px}
.hint{color:var(--txt2);font-size:12.5px;margin-bottom:18px;max-width:1000px}
.mut{color:var(--txt2)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- cards ---------- */
.card{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);
  padding:18px;margin-bottom:18px;box-shadow:var(--sombra)}
.grid{display:grid;gap:14px}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);
  font-weight:700;padding:9px 10px;border-bottom:2px solid var(--borda-forte);white-space:nowrap;
  background:var(--superficie)}
td{padding:10px;border-bottom:1px solid #f0f3f6;vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover td{background:#f8fafb}
tr.crit td{background:var(--verm-cl)}
tr.crit:hover td{background:#fbdedb}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5}
.t-estoque{background:#eef1f4;color:var(--txt2)}
.t-baixado{background:var(--azul-cl);color:var(--azul)}
.t-pronto{background:var(--verde-cl);color:var(--verde-esc)}
.t-aguard{background:var(--amar-cl);color:var(--amarelo)}
.t-prod{background:#dcebfd;color:#144e9c}
.t-parada{background:var(--verm-cl);color:var(--vermelho)}
.t-fim{background:#ede7f6;color:var(--roxo)}
.t-enc{background:#e2e8f0;color:#475569}
.t-urg{background:var(--vermelho);color:#fff}
.t-plan{background:var(--azul-cl);color:var(--azul)}
.t-nplan{background:var(--verm-cl);color:var(--vermelho)}
.t-ap{background:var(--verde-cl);color:var(--verde-esc)}
.t-apo{background:var(--amar-cl);color:var(--amarelo)}
.t-rep{background:var(--verm-cl);color:var(--vermelho)}

/* ---------- botões ---------- */
button.b{border:1px solid var(--borda-forte);background:var(--superficie);padding:8px 14px;
  border-radius:9px;font:600 12.5px/1 'Inter',sans-serif;cursor:pointer;color:var(--txt);
  transition:all .15s;box-shadow:var(--sombra)}
button.b:hover{background:var(--fundo);border-color:#b9c3cd;transform:translateY(-1px)}
button.b:active{transform:translateY(0)}
button.b.pri{background:var(--verde);border-color:var(--verde);color:#fff}
button.b.pri:hover{background:var(--verde-esc);border-color:var(--verde-esc)}
button.b.dng{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
button.b.dng:hover{filter:brightness(.92)}
button.b.warn{background:var(--amarelo);border-color:var(--amarelo);color:#fff}
button.b.warn:hover{filter:brightness(.92)}
button.b:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.b.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}

/* ---------- inputs ---------- */
input,select,textarea{padding:8px 10px;border:1px solid var(--borda-forte);border-radius:8px;
  font:500 13px/1.4 'Inter',sans-serif;color:var(--txt);background:#fff;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);
  box-shadow:0 0 0 3px rgba(14,138,79,.13)}
input:disabled{background:var(--fundo);color:var(--txt2)}
input.w70{width:70px} input.w90{width:92px} input.w110{width:116px}

/* ---------- quadro de programação ---------- */
.board{display:grid;grid-template-columns:96px 1fr 1fr;gap:12px}
.board .hd{font-size:12.5px;font-weight:700;text-align:center;padding:10px;
  background:var(--verde-cl);border:1px solid #cdeadb;border-radius:10px;color:var(--verde-900)}
.board .rot{font-size:12px;font-weight:700;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;background:var(--superficie);border:1px solid var(--borda);
  border-radius:10px;padding:8px;gap:2px}
.board .rot small{font-weight:500;color:var(--txt2);font-size:10px}
.cell{background:var(--superficie);border:1px solid var(--borda);border-radius:10px;padding:12px;
  min-height:150px;transition:outline .12s}
.cell.over{outline:2px dashed var(--verde);outline-offset:-3px;background:#fbfefc}
.cell.cheio{border-color:#f3b7b1}
.bar{height:8px;background:#edf1f4;border-radius:5px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--verde),#27ae6b);
  transition:width .3s}
.bar i.warn{background:linear-gradient(90deg,#d69e2e,var(--amarelo))}
.bar i.dng{background:linear-gradient(90deg,#e15347,var(--vermelho))}
.cap{font-size:11.5px;color:var(--txt2);display:flex;justify-content:space-between;margin-bottom:7px;gap:8px}
.cap b{color:var(--txt);font-size:12.5px}

/* cartões de ordem */
.ord{border:1px solid var(--borda);border-left:4px solid var(--verde);border-radius:9px;
  padding:9px 11px;margin-bottom:8px;cursor:grab;background:var(--superficie);
  transition:box-shadow .15s,transform .12s;box-shadow:var(--sombra)}
.ord:hover{box-shadow:var(--sombra-2);transform:translateY(-1px)}
.ord:active{cursor:grabbing}
.ord.urg{border-left-color:var(--vermelho);background:#fffbfb}
.ord .l1{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:12.5px}
.ord .l2{font-size:11.5px;color:var(--txt2);margin-top:3px}
.ord .l3{margin-top:7px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);
  padding:15px 16px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--borda-forte)}
.kpi.ok::before{background:var(--verde)}
.kpi.bad::before{background:var(--vermelho)}
.kpi.mid::before{background:var(--amarelo)}
.kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);font-weight:700}
.kpi .vl{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:5px}
.kpi .fo{font-size:11.5px;color:var(--txt2);margin-top:3px}
.kpi.ok .vl{color:var(--verde-esc)} .kpi.bad .vl{color:var(--vermelho)} .kpi.mid .vl{color:var(--amarelo)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(13,20,26,.55);backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;padding:28px 20px;overflow-y:auto;z-index:50}
.ov.on{display:flex}
.mod{background:var(--superficie);border-radius:16px;max-width:1020px;width:100%;overflow:hidden;
  box-shadow:0 24px 60px rgba(7,20,13,.35)}
.mod .mh{background:linear-gradient(135deg,var(--verde-900),var(--verde-esc));color:#fff;
  padding:15px 22px;display:flex;justify-content:space-between;align-items:center}
.mod .mh b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.mod .mh button{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:16px;transition:background .15s}
.mod .mh button:hover{background:rgba(255,255,255,.32)}
.mod .mb{padding:20px 22px;max-height:calc(100vh - 150px);overflow-y:auto}

/* ---------- seções do modal ---------- */
.sec{border:1px solid var(--borda);border-radius:11px;margin-bottom:16px;overflow:hidden}
.sec>.sh{background:linear-gradient(180deg,#f8fafb,#f1f5f7);padding:10px 14px;font-size:11px;
  font-weight:800;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--borda);
  color:#3d4c5c}
.sec>.sb{padding:14px}

.fl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;font-weight:600;color:var(--txt2)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.info div span{display:block;font-size:10.5px;color:var(--txt2);text-transform:uppercase;
  letter-spacing:.4px;font-weight:600;margin-bottom:2px}
.info div b{font-size:13.5px;font-weight:700}

/* ---------- alertas ---------- */
.alert{background:var(--amar-cl);border:1px solid #ecd9ae;border-left:4px solid var(--amarelo);
  padding:11px 14px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.alert.r{background:var(--verm-cl);border-color:#f3c6c1;border-left-color:var(--vermelho)}
.rolebox{background:var(--azul-cl);border:1px solid #c5dcf5;border-radius:9px;padding:11px 14px;
  font-size:12.5px;margin-bottom:18px}
.legend{font-size:11.5px;color:var(--txt2);margin-top:10px;line-height:1.6}

.dv-ok{color:var(--verde-esc);font-weight:700} .dv-w{color:var(--amarelo);font-weight:700}
.dv-b{color:var(--vermelho);font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- pareto ---------- */
.pareto{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.pareto .nm{width:200px;flex-shrink:0}
.pareto .pb{flex:1;height:18px;background:#edf1f4;border-radius:5px;overflow:hidden}
.pareto .pb i{display:block;height:100%;border-radius:5px}
.pareto .vv{width:74px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9d3dc;border-radius:6px;border:2px solid var(--fundo)}
::-webkit-scrollbar-thumb:hover{background:#aeb9c4}

/* ---------- responsivo: tablet e celular ---------- */
@media(max-width:1024px){ main{padding:16px} }
@media(max-width:860px){
  .board{grid-template-columns:1fr}
  .board .hd{display:none}
  .card{overflow-x:auto}
  header{padding:10px 14px;gap:10px}
  header .dia{order:5;flex-basis:100%;text-align:center}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
  h2{font-size:17px}
  .mod .mb{max-height:calc(100vh - 120px)}
}
@media(max-width:540px){
  main{padding:10px}
  header .logo{font-size:14px}
  header .sub{display:none}
  header select{padding:6px 8px;font-size:11px}
  nav{padding:6px 8px 0}
  nav button{padding:9px 11px 12px;font-size:12px}
  .ov{padding:8px}
  .mod{border-radius:12px}
  .mod .mh{padding:12px 14px}
  .mod .mb{padding:12px}
  .kpi{padding:12px}
  .kpi .vl{font-size:20px}
  .fl .fld{flex:1 1 46%;min-width:0}
  .fl .fld input,.fl .fld select{width:100%}
  button.b{padding:8px 12px}
  .pareto .nm{width:120px}
  td,th{padding:8px 7px}
}
/* relatório de impressão */
#printArea{display:none}
@media print{
  header,nav,main,.ov{display:none!important}
  #printArea{display:block!important;font:11px/1.4 Arial,sans-serif;color:#000}
  #printArea table{width:100%;border-collapse:collapse;margin-top:6px}
  #printArea th,#printArea td{border:1px solid #888;padding:3px 5px;text-align:left;font-size:10.5px}
  #printArea th{background:#eee}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">TSI · Controle de Tratamento de Sementes</div>
    <div class="sub">Sementes Veneza — protótipo de validação</div>
  </div>
  <div class="spacer"></div>
  <div class="dia">Dia de produção: <b id="hDia">27/07/2026</b> <span style="opacity:.7">(07:30 → 03:00)</span></div>
  <label style="font-size:11px;opacity:.85">Perfil:
    <select id="selRole"></select>
  </label>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<div id="printArea"></div>
<div class="ov" id="ov"><div class="mod">
  <div class="mh"><b id="modT">Ordem</b><button onclick="fecha()">&times;</button></div>
  <div class="mb" id="modB"></div>
</div></div>

<script>
/* ============================================================
   ESTADO  (protótipo — dados em memória, sem servidor)
   ============================================================ */
// telas de origem dos dados (SimpleAgro) — atalhos na aba Ordens
const SA_BASE    = 'https://sementesveneza.painel.simpleagro.com.br:3333';
const SA_PEDIDOS = SA_BASE+'/sales/relatorios/pedidos-analitico-resumido';
const SA_SALDOS  = SA_BASE+'/work/saldos';

const CAP_TH = 12;               // toneladas/hora por máquina (configurável)
const LIM_DESVIO = 5;            // % de alerta de desvio de consumo

const S = {
  role: 'PCP',
  dia: '2026-07-27',
  maquinas: [
    {id:'TSI1', nome:'TSI 1', cap:CAP_TH, tanques:5},
    {id:'TSI2', nome:'TSI 2', cap:CAP_TH, tanques:5}
  ],
  turnos: [
    {id:1, nome:'Turno 1', ini:'07:30', fim:'17:30', horas:10.0},
    {id:2, nome:'Turno 2', ini:'17:30', fim:'03:00', horas:9.5}
  ],
  embalagens: [
    {cod:'BG5M',    desc:'Bag 5 milhões de sementes',   sem:5000000},
    {cod:'BG2,5M',  desc:'Bag 2,5 milhões de sementes', sem:2500000},
    {cod:'MEIOBAG', desc:'Meio bag',                    sem:2500000}
  ],
  // dens = densidade (g/ml): converte a dose em ml/kg para PESO de balança.
  // A receita continua por dose; a produção afere a balança pelo peso (dose × densidade).
  quimicos: [
    {id:'FTZ', nome:'Fortenza Duo',      un:'ml/kg', dens:1.08},
    {id:'CRU', nome:'Cruiser 350 FS',    un:'ml/kg', dens:1.10},
    {id:'MXA', nome:'Maxim Advanced',    un:'ml/kg', dens:1.05},
    {id:'DER', nome:'Dermacor',          un:'ml/kg', dens:1.15},
    {id:'RAN', nome:'Rancona',           un:'ml/kg', dens:1.12},
    {id:'POL', nome:'Polímero Verde',    un:'ml/kg', dens:1.20},
    {id:'GRF', nome:'Grafite',           un:'g/kg',  dens:null},
    {id:'EKM', nome:'Inoculante EKM',    un:'ml/kg', dens:1.02}
  ],
  baixas: [],   // log de baixas/estornos de lotes (relatório da logística)
  /* FOTO DIÁRIA (upload de planilha, até integrar com SAP):
     pedidos de venda e estoque de produto acabado, por cultivar+tratamento+embalagem */
  // demanda é indexada pelo CÓDIGO do tratamento (recNome) — aceita código ainda sem receita cadastrada.
  // aprov=false: pedido Integrado mas aguardando aprovação financeira — fica FORA do balanço
  pedidosVenda: [
    {cult:'761 I2X',     recNome:'FTZ60',            emb:'BG5M', bags:150, aprov:true},
    {cult:'761 I2X',     recNome:'FTZ60',            emb:'BG5M', bags:35,  aprov:false},
    {cult:'NEO680 IPRO', recNome:'FTZ60',            emb:'BG5M', bags:40,  aprov:true},
    {cult:'O760 CE',     recNome:'CORTEVA ESPECIAL', emb:'BG5M', bags:200, aprov:true},
    {cult:'O790 IPRO',   recNome:'V&P',              emb:'BG5M', bags:30,  aprov:true},
    {cult:'NEO700 I2X',  recNome:'V&P',              emb:'BG5M', bags:50,  aprov:true},
    {cult:'NEO750 IPRO', recNome:'CORTEVA ESPECIAL', emb:'BG5M', bags:22,  aprov:true}
  ],
  estoquePA: [
    {cult:'761 I2X',     recNome:'FTZ60',            emb:'BG5M',   bags:20},
    {cult:'761 I2X',     recNome:'FTZ60',            emb:'BG2,5M', bags:40},  // estoque parado: sem pedido nesta embalagem
    {cult:'O760 CE',     recNome:'CORTEVA ESPECIAL', emb:'BG5M',   bags:10},
    {cult:'NEO750 IPRO', recNome:'CORTEVA ESPECIAL', emb:'BG5M',   bags:25},  // estoque cobre o pedido de 22
    {cult:'O820 IPRO',   recNome:'V&P',              emb:'BG5M',   bags:15}   // sem pedido algum
  ],
  demandaEm: 'carga de exemplo — 27/07/2026 07:00',
  lotesQ: [
    {id:'FTZ-2291', q:'FTZ'},{id:'FTZ-2304', q:'FTZ'},
    {id:'CRU-8813', q:'CRU'},{id:'MXA-4420', q:'MXA'},
    {id:'DER-7701', q:'DER'},{id:'RAN-3312', q:'RAN'},
    {id:'POL-9004', q:'POL'},{id:'GRF-1180', q:'GRF'},
    {id:'EKM-5521', q:'EKM'}
  ],
  // nomes das receitas = CÓDIGOS do comercial (SimpleAgro) — língua única.
  // Produtos/doses/densidades são dados de EXEMPLO; substituir pelas receitas reais.
  receitas: [
    {id:'R1', nome:'FTZ60', itens:[
      {q:'FTZ', dose:0.60, tq:1},{q:'MXA', dose:0.25, tq:2},

const ocup = (m,d) => { const c=capDia(m); const ton=cel(m,d).reduce((a,o)=>a+pesoT(o),0);
  return {ton, c, pc: c?ton/c*100:0}; };

// primeiro encaixe com capacidade livre para um peso (t), varrendo dias → máquinas
function sugestao(pT){

    if(x.ton + pT <= x.c) return {d, m:m.id, livre:x.c-x.ton};
  }
  return null;
}

/* melhor slot para uma ordem: dia mais cedo primeiro; dentro do dia,
   máquina que já tem a MESMA RECEITA+CULTIVAR (0), depois mesma receita (1),
   depois a menos carregada (2) — é o agrupamento que reduz setup */
function melhorSlot(o){
  for(const d of DIAS){
    const cand = S.maquinas
      .map(m=>({m:m.id, x:ocup(m.id,d)}))
      .filter(c=>c.x.ton + pesoT(o) <= c.x.c)
      .map(c=>{
        const os = cel(c.m,d);
        const afim = os.some(x=>x.rec===o.rec && x.cult===o.cult) ? 0
                   : os.some(x=>x.rec===o.rec) ? 1 : 2;
        return {...c, afim};
      })
      .sort((a,b)=> a.afim-b.afim || a.x.ton-b.x.ton);
    if(cand.length) return {m:cand[0].m, d, afim:cand[0].afim};
  }
  return null;
}

/* ============================================================

   Necessidade líquida = Pedidos de venda − Estoque PA − Ordens abertas
   Ordem "aberta" = qualquer status antes de Apontada (lançada no AGROTIS,
   quando passa a refletir no estoque do próximo upload).
   ============================================================ */
// resolve id de receita OU código direto para o nome/código canônico
const nomeRec = r => { const x = rec(r); return x ? x.nome : String(r); };
const somaBags = (arr,cult,rn,emb) =>
  arr.filter(x=>x.cult===cult && x.recNome===rn && x.emb===emb).reduce((a,x)=>a+x.bags,0);

function balancoDemanda(cult, recOuNome, emb, ignoreId, extraConsumo){
  const rn = nomeRec(recOuNome);
  // regra SimpleAgro: só pedido APROVADO (financeiro) entra no balanço;
  // Integrado + não aprovado fica visível como "aguardando aprovação"
  const pv = S.pedidosVenda.filter(p=>p.cult===cult && p.recNome===rn && p.emb===emb);
  const ped     = pv.filter(p=>p.aprov!==false).reduce((a,p)=>a+p.bags,0);
  const pedPend = pv.filter(p=>p.aprov===false).reduce((a,p)=>a+p.bags,0);
  const est = somaBags(S.estoquePA, cult, rn, emb);
  const abertas = S.ordens
    .filter(o=>o.id!==ignoreId && o.cult===cult && nomeRec(o.rec)===rn && o.emb===emb
            && statusOrd(o)!=='Apontada')
    .reduce((a,o)=>a+o.bags,0) + (extraConsumo||0);
  return {ped, pedPend, est, abertas, saldo: ped - est - abertas};
}

/* ---- conversão do relatório SimpleAgro (pedidos analítico resumido) ---- */
const EMB_DEPARA = {'BB5M':'BG5M', 'BMB':'MEIOBAG'};
const ehSimpleAgro = rows => (rows[0]||[]).includes('Status Pedido') && (rows[0]||[]).includes('Saldo a Faturar');

function convertSimpleAgro(rows){
  const h = rows[0], ix = n => h.indexOf(n);
  const iE=ix('Status Pedido'), iH=ix('Status Financeiro'), iAL=ix('Produto'),
        iAT=ix('Tratamento'), iAU=ix('Embalagem'), iBW=ix('Saldo a Faturar');
  const agg = {};
  const resumo = {total:rows.length-1, foraStatus:0, semTsi:0, saldoZero:0, ok:0,
                  semReceita:{}, embDesc:{}};
  rows.slice(1).forEach(r=>{
    if((r[iE]||'').trim()!=='Integrado'){ resumo.foraStatus++; return; }          // regra: coluna E
    const trat = String(r[iAT]||'').trim();
    if(!trat || trat.toUpperCase()==='SEM TSI'){ resumo.semTsi++; return; }       // sem TSI: fora da programação
    const bags = parseFloat(String(r[iBW]).replace(',','.')) || 0;                // regra: coluna BW
    if(bags<=0){ resumo.saldoZero++; return; }                                    // já faturado: sem demanda
    const emb = EMB_DEPARA[String(r[iAU]||'').trim()];
    if(!emb){ const e=String(r[iAU]||'?'); resumo.embDesc[e]=(resumo.embDesc[e]||0)+bags; return; }
    // código = nome da receita. Código SEM receita cadastrada NÃO é descartado:
    // o pedido existe — entra na demanda e o painel marca "receita não cadastrada"
    const rc = S.receitas.find(x=>x.nome.toUpperCase()===trat.toUpperCase());
    const rn = rc ? rc.nome : trat;
    if(!rc) resumo.semReceita[trat]=(resumo.semReceita[trat]||0)+bags;
    const cult = String(r[iAL]||'').split(' - ')[0].trim();
    const aprov = (r[iH]||'').trim()==='Aprovado';                                // regra: coluna H
    const k = [cult, rn, emb, aprov?'A':'P'].join('|');
    agg[k] = (agg[k]||0) + bags;
    resumo.ok++;
  });
  const linhas = Object.keys(agg).sort().map(k=>{
    const [c,rn,e,f] = k.split('|'); return [c,rn,e,agg[k],f].join(';');
  });
  return {linhas, resumo};
}

// avisos "fortes" (não bloqueiam — decisão do PCP) + estoque parado do mesmo cultivar+tratamento
function analiseDemanda(cult, recId, emb, bagsNovos, ignoreId, extraConsumo){
  const rn = nomeRec(recId);
  const b = balancoDemanda(cult, rn, emb, ignoreId, extraConsumo);
  const avisos = [];
  if(b.ped===0) avisos.push('SEM PEDIDO DE VENDA para '+cult+' + '+rn+' + '+emb);
  else{
    if(b.est>=b.ped) avisos.push('ESTOQUE JÁ COBRE o pedido: '+b.est+' bg em estoque para '+b.ped+' bg pedidos');
    else if(b.saldo<=0 && b.abertas>0)
      avisos.push('JÁ PLANEJADO: '+b.abertas+' bg em ordens abertas (pedido '+b.ped+' − estoque '+b.est+' já atendido)');
    else if(bagsNovos>b.saldo)
      avisos.push('EXCEDE a necessidade: saldo descoberto é '+Math.max(0,b.saldo)+' bg e a ordem tem '+bagsNovos+' bg');
  }
  // estoque parado: mesma cultivar+tratamento, em embalagem SEM pedido de venda
  const parado = S.estoquePA.filter(e=>e.cult===cult && e.recNome===rn && e.bags>0
    && somaBags(S.pedidosVenda, cult, rn, e.emb)===0);
  return {b, avisos, parado};
}

// status derivado: lote baixado libera a ordem
function statusOrd(o){
  if(['Em produção','Parada','Finalizada','Qualidade apontada','Apontada'].includes(o.status)) return o.status;
  if(!o.maq) return 'Não programada';
  return lote(o.lote)?.status === 'Em estoque' ? 'Aguardando lote' : 'Pronto para produzir';
}

/* ---- tempos ---- */
function tempos(o){
  const ini = o.eventos.find(e=>e.t==='inicio');
  const fim = o.eventos.find(e=>e.t==='fim');
  if(!ini) return {bruto:0, pPlan:0, pNao:0, par:0, liq:0, lead:0};
  const fimTs = fim ? fim.ts : Date.now();
  const bruto = (fimTs - ini.ts)/1000;
  let pPlan=0, pNao=0;
  o.paradas.forEach(p=>{
    const d = ((p.fim||Date.now()) - p.ini)/1000;
    if(motivo(p.motivo).tipo==='Planejada') pPlan+=d; else pNao+=d;
  });
  const par = pPlan+pNao;
  return {bruto, pPlan, pNao, par, liq:Math.max(0,bruto-par),
          lead: bruto /* protótipo: liberação = início da 1ª ordem */};
}
function hms(s){
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), g=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(g).padStart(2,'0');
}

/* ---- pesos de balança (densidade) e consumo Real vs Planejado por TANQUE ---- */
// peso de balança planejado de um item da receita (kg):
//   ml/kg -> dose × peso semente × densidade / 1000
//   g/kg  -> dose × peso semente / 1000
const pesoItemKg = (it, kg) => { const q = quim(it.q);
  return q.un==='ml/kg' ? it.dose*kg*(q.dens||1)/1000 : it.dose*kg/1000; };

// peso total de químico da ordem (kg) e peso de ensaque por bag
const pesoQuimKg = o => rec(o.rec).itens.reduce((a,it)=>a+pesoItemKg(it, pesoKg(o)), 0);
const ensaqueBag = o => (lote(o.lote)?.pesoBag||0) + (o.bags? pesoQuimKg(o)/o.bags : 0);

// monta os tanques da ordem agrupando itens da receita por tanque —
// receita com mais de 5 produtos = MISTURA de produtos no mesmo tanque
function montaTanques(o){
  const g = {};
  rec(o.rec).itens.forEach(it=>{ (g[it.tq]=g[it.tq]||[]).push(it); });
  return Object.keys(g).sort((a,b)=>a-b)
    .map(tq=>({tq:+tq, itens:g[tq], lotesQ:[], pi:null, pf:null}));
}

// Real vs Planejado por tanque: planejado = Σ pesos de balança dos produtos do tanque;
// real = peso inicial − peso final (balança)
function consumosTq(o){
  const kg = pesoKg(o);
  return (o.tanques||[]).map(t=>{
    const plan = t.itens.reduce((a,it)=>a+pesoItemKg(it,kg),0);
    // volume planejado (L) — só produtos dosados em ml/kg
    const vol = t.itens.reduce((a,it)=>quim(it.q).un==='ml/kg' ? a+it.dose*kg/1000 : a, 0);
    const real = (t.pi!=null && t.pf!=null) ? Math.max(0, t.pi-t.pf) : null;
    return {...t, plan, vol, real, dv: (real==null||!plan) ? null : (real-plan)/plan*100};
  });
}

/* ---- painel Demanda × Estoque × Planejado (visão do PCP) ---- */
function painelDemanda(){
  const keys = {};
  const add = (cult,rn,emb) => keys[[cult,rn,emb].join('|')] = true;
  S.pedidosVenda.forEach(p=>add(p.cult,p.recNome,p.emb));
  S.estoquePA.forEach(e=>add(e.cult,e.recNome,e.emb));
  S.ordens.filter(o=>statusOrd(o)!=='Apontada').forEach(o=>add(o.cult,nomeRec(o.rec),o.emb));
  const rows = Object.keys(keys).map(k=>{
    const [cult,recNome,emb] = k.split('|');
    const b = balancoDemanda(cult,recNome,emb);
    let st, cls;
    if(b.ped===0 && b.est>0){ st='ESTOQUE SEM PEDIDO'; cls='t-apo'; }
    else if(b.ped===0){ st='planejado sem pedido'; cls='t-estoque'; }
    else if(b.est>=b.ped){ st='estoque cobre'; cls='t-baixado'; }
    else if(b.saldo>0){ st='DESCOBERTO: '+b.saldo+' bg'; cls='t-parada'; }
    else if(b.saldo<0){ st='excesso planejado: '+(-b.saldo)+' bg'; cls='t-aguard'; }
    else { st='coberto'; cls='t-pronto'; }
    return {cult,recNome,emb,b,st,cls, cadastrada: S.receitas.some(x=>x.nome===recNome)};
  }).sort((a,c)=>c.b.saldo-a.b.saldo);
  const desc = rows.filter(r=>r.b.ped>0 && r.b.est<r.b.ped && r.b.saldo>0);
  return `<div class="card"><h3>Demanda × Estoque × Planejado
      <span class="mut" style="font-weight:400;font-size:12px">— por cultivar + tratamento + embalagem ·
      carga: ${S.demandaEm}</span></h3>
    ${desc.length?`<div class="alert"><b>${desc.length} combinação(ões) com pedido descoberto</b> —
      falta programar ${desc.reduce((a,r)=>a+r.b.saldo,0)} bg no total.</div>`:''}
    <table><thead><tr><th>Cultivar</th><th>Tratamento</th><th>Emb.</th>
      <th class="num">Pedido aprov.</th><th class="num" title="Integrado, aguardando aprovação financeira — fora do balanço">Aguard. aprov.</th>
      <th class="num">Estoque PA</th><th class="num">Ordens abertas</th>
      <th class="num">Saldo</th><th>Situação</th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${r.cult}</td>
      <td>${r.recNome}${r.cadastrada?'':' <span class="tag t-apo" title="cadastre a receita com este código para poder criar ordens">receita não cadastrada</span>'}</td>
      <td>${r.emb}</td>
      <td class="num">${r.b.ped||'—'}</td>
      <td class="num ${r.b.pedPend?'dv-w':''}">${r.b.pedPend||'—'}</td>
      <td class="num">${r.b.est||'—'}</td>
      <td class="num">${r.b.abertas||'—'}</td>
      <td class="num"><b class="${r.b.saldo>0?'dv-b':(r.b.saldo<0?'dv-w':'dv-ok')}">${r.b.saldo}</b></td>
      <td><span class="tag ${r.cls}">${r.st}</span></td></tr>`).join('')}
    </tbody></table>
    <div class="legend"><b>Saldo</b> = pedido − estoque − ordens abertas (tudo antes de "Apontada").
    Saldo positivo = falta produzir · negativo = produção além do pedido · ordens Apontadas passam a
    contar no estoque do próximo upload.</div></div>`;
}

/* ---- exportação de relatórios para Excel ---- */
function baixaXlsx(nome, abas){
  if(typeof XLSX==='undefined'){ alert('O gerador de Excel não carregou (sem internet?).'); return; }
  const wb = XLSX.utils.book_new();
  abas.forEach(a=>XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a.dados), a.nome));
  XLSX.writeFile(wb, nome+'_'+S.dia+'.xlsx');
}
const hrs = s => +(s/3600).toFixed(2);

function linhasOrdens(){
  const d=[['Seq','Nº ordem','Prioridade','Cultivar','Tratamento','Emb.','Bags','Lote semente',
    'Peso (t)','Ensaque/bag (kg)','Máquina','Data','Turno','Status','Cliente','Observação','Lotes de químico']];
  filtraOrdens().forEach(o=>{
    const pos = o.maq ? cel(o.maq,o.data).indexOf(o)+1 : '';
    d.push([pos, o.num, o.prioridade, o.cult, rec(o.rec).nome, o.emb, o.bags, o.lote,
      +pesoT(o).toFixed(2), +ensaqueBag(o).toFixed(1),
      o.maq?maq(o.maq).nome:'pool', o.maq?o.data:'', o.turno?'T'+o.turno:'', statusOrd(o),
      o.cliente||'', o.obs||'', [...new Set((o.tanques||[]).flatMap(t=>t.lotesQ))].join(', ')]);
  });
  return d;
}
function linhasProducaoOrdem(){
  const d=[['Ordem','Máquina','Turno','Data','Peso (t)','Início','Fim','Planejado (h)',
    'Bruto (h)','Bruto vs plan (%)','Líquido (h)','Líq vs plan (%)','Parado (h)',
    'Parada planejada (h)','Parada não plan. (h)','Prod. bruta (t/h)','Prod. líquida (t/h)','Qualidade']];
  S.ordens.filter(o=>tempos(o).bruto>0).forEach(o=>{
    const T=tempos(o);
    const ini=o.eventos.find(e=>e.t==='inicio'), fim=o.eventos.find(e=>e.t==='fim');
    const plan=pesoT(o)/maq(o.maq).cap*3600;
    d.push([o.num, maq(o.maq).nome, o.turno?'T'+o.turno:'', o.data, +pesoT(o).toFixed(2),
      ini?new Date(ini.ts).toLocaleString('pt-BR'):'', fim?new Date(fim.ts).toLocaleString('pt-BR'):'',
      hrs(plan), hrs(T.bruto), +(T.bruto/plan*100).toFixed(0), hrs(T.liq), +(T.liq/plan*100).toFixed(0),
      hrs(T.par), hrs(T.pPlan), hrs(T.pNao),
      T.bruto?+(pesoT(o)/(T.bruto/3600)).toFixed(2):'', T.liq?+(pesoT(o)/(T.liq/3600)).toFixed(2):'',
      o.qual?o.qual.visual:'']);
  });
  return d;
}
function linhasProducaoPeriodo(){
  const fin=S.ordens.filter(o=>['Finalizada','Qualidade apontada','Apontada'].includes(o.status));
  const porDia={};
  fin.forEach(o=>{ const T=tempos(o);
    const g=porDia[o.data]=porDia[o.data]||{ton:0,n:0,b:0,p:0,l:0};
    g.ton+=pesoT(o); g.n++; g.b+=T.bruto; g.p+=T.par; g.l+=T.liq; });
  const dias=Object.keys(porDia).sort();
  const soma=iso=>dias.filter(x=>x>=iso).reduce((a,x)=>({ton:a.ton+porDia[x].ton,n:a.n+porDia[x].n,
    b:a.b+porDia[x].b,p:a.p+porDia[x].p,l:a.l+porDia[x].l}),{ton:0,n:0,b:0,p:0,l:0});
  const linha=(nome,g)=>[nome,g.n,+g.ton.toFixed(2),hrs(g.b),hrs(g.p),hrs(g.l),
    g.l?+(g.ton/(g.l/3600)).toFixed(2):''];
  const d=[['Período','Ordens','Produzido (t)','Bruto (h)','Parado (h)','Líquido (h)','Prod. líquida (t/h)']];
  dias.forEach(x=>d.push(linha(x,porDia[x])));
  d.push(linha('Semana (últimos 7 dias)',soma(addD(S.dia,-6))));
  d.push(linha('Mês corrente',soma(S.dia.slice(0,8)+'01')));
  d.push(linha('Geral',soma('0000-00-00')));
  return d;
}
function linhasLogistica(){
  const d=[['Data/hora','Lote','Bags','Peso (t)','Por','Tipo']];
  S.baixas.forEach(b=>d.push([new Date(b.ts).toLocaleString('pt-BR'), b.lote, b.bags,
    +b.peso.toFixed(2), b.por, b.estorno?'estorno':'baixa']));
  return d;

/* ============================================================
   RELATÓRIO DE SALDOS (SimpleAgro Work) — uma fonte, dois destinos:
   · linhas COM embalagem e tratamento "SEM TSI"  → LOTES DE SEMENTE (entrada do TSI)
   · linhas COM embalagem e tratamento real       → ESTOQUE PA (produto acabado)
   · PRÉ-LOTE / granel (sem embalagem)            → ignorado (matéria-prima)
   Peso do bag = PMS × 5 (BB5M) ou × 2,5 (BMB)
   ============================================================ */
const EMB_SALDOS = {'BB5M':{cod:'BG5M', fator:5}, 'BMB':{cod:'MEIOBAG', fator:2.5}};
const ehSaldosSA = rows => { const h=(rows[0]||[]).map(x=>String(x||'').toUpperCase());
  return h.includes('LOTE TRATAMENTO') && h.includes('SALDO') && h.includes('CULTIVAR'); };

function convertSaldos(rows){
  const h = rows[0].map(x=>String(x||'').trim().toUpperCase());
  const ix = n => h.indexOf(n);
  const iN=ix('NOME PRODUTO'), iC=ix('CULTIVAR'), iL=ix('LOTE'),
        iT=ix('LOTE TRATAMENTO'), iS=ix('SALDO');
  const iP = h.findIndex(x=>x.includes('PME')||x.includes('PMS'));
  const num = v => { const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
  const lotes = {}, est = {};
  const resumo = {total:rows.length-1, granel:0, semSaldo:0, negativos:[], lotes:0, estoque:0, semPms:0};
  rows.slice(1).forEach(r=>{
    const toks = String(r[iN]||'').trim().split(/\s+/);
    const embRaw = toks[toks.length-1];
    const cfg = EMB_SALDOS[embRaw];
    if(!cfg){ resumo.granel++; return; }                       // pré-lote/granel: fora
    const bags = num(r[iS]);
    if(bags<0) resumo.negativos.push(String(r[iL]||'?')+' ('+bags+')');
    if(bags<=0){ resumo.semSaldo++; return; }   // saldo zero/negativo não vira lote nem estoque
    const cult = String(r[iC]||'').trim();
    const trat = String(r[iT]||'').trim();
    const pms  = iP>=0 ? num(r[iP]) : 0;
    if(trat.toUpperCase()==='SEM TSI'){                        // entrada do TSI → lote de semente
      const id = String(r[iL]||'').trim(); if(!id) return;
      if(!pms) resumo.semPms++;
      const a = lotes[id] || (lotes[id]={cult, emb:cfg.cod, peso:+(pms*cfg.fator).toFixed(0), bags:0});
      a.bags += bags;
    } else {                                                   // já tratado → estoque PA
      const k = [cult, trat, cfg.cod].join('|');
      est[k] = (est[k]||0) + bags;
    }
  });
  resumo.lotes = Object.keys(lotes).length;
  resumo.estoque = Object.keys(est).length;
  return {
    linhasLotes: Object.keys(lotes).sort().map(id=>{ const l=lotes[id];
      return [id, l.cult, l.peso, l.bags].join(';'); }),
    linhasEstoque: Object.keys(est).sort().map(k=>{ const [c,t,e]=k.split('|');
      return [c,t,e,est[k]].join(';'); }),
    resumo,
    totalBagsLotes: Object.values(lotes).reduce((a,l)=>a+l.bags,0),
    totalBagsEst: Object.values(est).reduce((a,b)=>a+b,0)
  };
}

/* ---- leitura de arquivos Excel (.xlsx/.xls/.csv) via SheetJS ---- */
function lerExcel(inp, cb){
  const f = inp.files && inp.files[0]; if(!f) return;
  if(typeof XLSX==='undefined'){
    alert('O leitor de Excel não carregou (sem internet?). Use a caixa de colar ao lado.');
    inp.value=''; return;
  }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''})
        .map(r=>r.map(c=>String(c).trim()))
        .filter(r=>r.some(c=>c!==''));
      cb(rows);
    }catch(err){ alert('Não consegui ler o arquivo: '+err.message); }
    inp.value='';
  };
  rd.readAsArrayBuffer(f);
}
// junta as células com ';' e descarta a 1ª linha se for cabeçalho (coluna numérica sem número)
function rowsParaTexto(rows, colNum){
  if(rows.length && isNaN(parseFloat(String(rows[0][colNum]??'').replace(',','.')))) rows = rows.slice(1);
  return rows.map(r=>r.join(';')).join('\n');
}

/* ---- upload diário (substituição total) ---- */
function parseDemanda(txt){
  const out=[], err=[];
  txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(ln=>{
    // 5ª coluna opcional: A = aprovado (padrão) · P = aguardando aprovação financeira.
    // Código de tratamento sem receita cadastrada é ACEITO (demanda existe mesmo assim).
    const [cult,recRaw,emb,bags,fl] = ln.split(';').map(x=>x.trim());
    if(!cult || !recRaw || !S.embalagens.some(e=>e.cod===emb) || !(+bags>0)){ err.push(ln); return; }
    const rc = rec(recRaw) || S.receitas.find(r=>r.nome.toUpperCase()===recRaw.toUpperCase());
    out.push({cult, recNome: rc ? rc.nome : recRaw, emb, bags:+bags,
              aprov: !(fl && fl.toUpperCase().startsWith('P'))});
  });
  return {out, err};
}
function importPedidos(){
  const {out,err} = parseDemanda(document.getElementById('fPed').value);
  S.pedidosVenda = out; S.demandaEm = new Date().toLocaleString('pt-BR');
  render();
  alert(out.length+' pedido(s) de venda carregados — SUBSTITUIÇÃO TOTAL da carga anterior.'
    +(err.length?'\n'+err.length+' linha(s) inválida(s) ignorada(s).':''));
}

function filtraOrdens(){
  return S.ordens.filter(o=>{
    if(_fDia==='pool' && o.maq) return false;
    if(_fDia!=='todos' && _fDia!=='pool' && (!o.maq || o.data!==_fDia)) return false;
    if(_fSt!=='todos' && statusOrd(o)!==_fSt) return false;
    if(_fMq!=='todos' && o.maq!==_fMq) return false;
    if(_fCult!=='todos' && o.cult!==_fCult) return false;
    if(_fRec!=='todos' && o.rec!==_fRec) return false;
    if(_fLote!=='todos' && o.lote!==_fLote) return false;
    if(_fBusca && ![o.num,o.cult,rec(o.rec).nome,o.lote,o.cliente,o.emb].join(' ').toUpperCase().includes(_fBusca)) return false;
    return true;
  }).sort((a,b)=> ((a.maq?0:1)-(b.maq?0:1)) || (a.data<b.data?-1:a.data>b.data?1:0)
     || (a.maq||'').localeCompare(b.maq||'')
     || ((a.prioridade==='Urgente'?0:1)-(b.prioridade==='Urgente'?0:1)) || a.seq-b.seq);
}

  const m = document.getElementById('fMaq').value;
  const d = document.getElementById('fData').value || S.diaSel;
  const l = lote(document.getElementById('fLote').value);
  const b = +document.getElementById('fBags').value || 0;
  const pT = l ? l.pesoBag*b/1000 : 0;
  if(!m){ el.innerHTML = pT ? 'Sem máquina: a ordem vai para o pool ('+n(pT,1)+' t).' : ''; return; }
  const x = ocup(m,d), novo = x.ton+pT, pc = novo/x.c*100;
  let msg = maq(m).nome+' · '+dow(d)+' '+fmtDia(d)+': ocupação atual <b>'+n(x.pc,0)+'%</b>'
          + (pT?' → com esta ordem <b>'+n(pc,0)+'%</b>':'');
  if(pc>100){
    const s = sugestao(pT);
    msg = '<span class="dv-b">'+msg+' — o dia está CHEIO.</span>'
        + (s?' Primeiro encaixe livre: <b>'+dow(s.d)+' '+fmtDia(s.d)+' · '+maq(s.m).nome+'</b> ('+n(s.livre,0)+' t livres).'
            :' Sem espaço nos próximos 7 dias.');
  }
  else if(pc>85) msg = '<span class="dv-w">'+msg+' — quase cheio.</span>';
  else msg = '<span class="dv-ok">'+msg+' — cabe com folga ('+n(x.c-novo,0)+' t restantes).</span>';
  el.innerHTML = msg;
}

function novaOrdem(){
  const g = id => document.getElementById(id).value.trim();
  const num=g('fNum'), loteId=g('fLote'), recId=g('fRec'), emb=g('fEmb'), bags=+g('fBags');
  if(!num)   return alert('Informe o número do pedido/ordem.');
  if(!loteId)return alert('Selecione o lote de semente — é dele que vem o peso.');
  if(!(bags>0)) return alert('Quantidade de bags deve ser maior que zero.');
  const cult = lote(loteId).cult;
  if(jaExiste({num,cult,rec:recId,emb}))
    return alert('Ordem já existe.\n\nChave: '+num+' + '+cult+' + '+rec(recId).nome+' + '+emb);
  // AVISO FORTE de demanda (não bloqueia — decisão do PCP)
  const an = analiseDemanda(cult, recId, emb, bags, null);
  if(an.avisos.length || an.parado.length){
    if(!confirm('⚠ AVISO DE DEMANDA — ordem '+num+':\n\n'
      + an.avisos.map(a=>'· '+a).join('\n')
      + (an.parado.length?'\n· ESTOQUE PARADO sem pedido (mesmo cultivar+tratamento): '
          +an.parado.map(p=>p.emb+' → '+p.bags+' bg').join(' · '):'')
      + '\n\nBalanço da combinação: pedido '+an.b.ped+' · estoque '+an.b.est
      + ' · já planejado '+an.b.abertas+' · saldo '+an.b.saldo+' bg'
      + '\n\nIncluir mesmo assim?')) return;
  }
  const mq = g('fMaq');
  if(mq){
    const d = g('fData')||S.diaSel;
    const x = ocup(mq,d), pT = lote(loteId).pesoBag*bags/1000;
    if(x.ton+pT > x.c){
      const s = sugestao(pT);
      if(!confirm('O dia escolhido está CHEIO: '+maq(mq).nome+' em '+fmtDia(d)
        +' ficaria com '+Math.round((x.ton+pT)/x.c*100)+'% de ocupação.'
        +(s?'\n\nPrimeiro encaixe livre: '+dow(s.d)+' '+fmtDia(s.d)+' · '+maq(s.m).nome+' ('+Math.round(s.livre)+' t livres).':'')
        +'\n\nIncluir mesmo assim?')) return;
    }
  }
  S.ordens.push(O({num, cult, rec:recId, emb, bags, lote:loteId,
    cliente:g('fCli'), obs:g('fObs'), prioridade:g('fPri'),
    maq: mq||null,
    data: g('fData') || S.diaSel, origem:'digitação'}));
  render();
  alert('Ordem '+num+' incluída'+(mq?' e programada em '+maq(mq).nome+'.':' no backlog.'));
}

function preverImport(){
  _csv = document.getElementById('fCsv').value;
  const linhas = _csv.split('\n').map(s=>s.trim()).filter(Boolean);
  const vistas = [];
  _prev = linhas.map(ln=>{
    const c = ln.split(';').map(s=>s.trim());
    const [num, recRaw, emb, bagsRaw, loteId, cli, obs] = c;
    const r = {num, recRaw, emb, bags:+bagsRaw, lote:loteId, cli, obs, ok:false, st:'Erro', msg:''};
    const l = lote(loteId), rc = rec(recRaw) || S.receitas.find(x=>x.nome.toUpperCase()===(recRaw||'').toUpperCase());
    if(c.length < 5)                 { r.msg='linha incompleta (mín. 5 campos)'; return r; }
    if(!num)                         { r.msg='pedido vazio'; return r; }
    if(!rc)                          { r.msg='receita não encontrada no cadastro'; return r; }
    if(!l)                           { r.msg='lote não encontrado na planilha de lotes'; return r; }
    if(!S.embalagens.some(e=>e.cod===emb)) { r.msg='embalagem não cadastrada'; return r; }
    if(!(r.bags>0))                  { r.msg='bags inválido'; return r; }
    r.rec=rc.id; r.recNome=rc.nome; r.cult=l.cult; r.peso=l.pesoBag*r.bags/1000;
    const k = chaveOrd(r);
    if(vistas.includes(k)) { r.st='Duplicada'; r.msg='repetida dentro do próprio arquivo'; return r; }
    if(jaExiste(r)) { r.st='Duplicada';
      r.msg='já cadastrada NO SISTEMA — mesma chave nº ordem + cultivar + tratamento + embalagem'; return r; }
    vistas.push(k); r.ok=true; r.st='Nova';
    return r;
  });
  // avaliação de demanda por linha válida, com consumo cumulativo do próprio arquivo
  const consumo = {};
  _prev.forEach(r=>{
    if(!r.ok) return;
    const k2 = [r.cult,r.rec,r.emb].join('|');
    const an = analiseDemanda(r.cult, r.rec, r.emb, r.bags, null, consumo[k2]||0);
    r.demOk = !an.avisos.length;
    r.dem = an.avisos.length ? an.avisos[0] : 'saldo '+an.b.saldo+' bg';
    consumo[k2] = (consumo[k2]||0) + r.bags;
  });
  render();
}

function confirmaImport(){
  const novas = _prev.filter(l=>l.ok);
  novas.forEach(l => S.ordens.push(O({num:l.num, cult:l.cult, rec:l.rec, emb:l.emb, bags:l.bags,
    lote:l.lote, cliente:l.cli||'', obs:l.obs||'', origem:'importação'})));
  const q = novas.length; _prev = null; render();
  alert(q+' ordem(ns) importada(s) para o backlog.\n\nUse a aba Programação para alocar em máquina e turno.');
}

function importLotes(){
  const ls = document.getElementById('fCsvL').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let novos=0, atual=0, err=0;
  ls.forEach(ln=>{
    // lote ; cultivar ; peso/bag ; bags disponíveis (opcional)
    const [id,cult,peso,bagsD] = ln.split(';').map(s=>s.trim());
    if(!id||!cult||!(+peso>0)){ err++; return; }
    const ex = lote(id);
    if(ex){ ex.cult=cult; ex.pesoBag=+peso; if(+bagsD>0) ex.bagsDisp=+bagsD; atual++; return; }
    S.lotes.push({id, cult, pesoBag:+peso, status:'Em estoque',
                  bagsDisp: +bagsD>0 ? +bagsD : undefined}); novos++;
  });
  render();
  alert(novos+' lote(s) novo(s) · '+atual+' atualizado(s) · '+err+' com erro.');
}

function delOrdem(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!regra(o,'del')){
    alert('Exclusão bloqueada: a ordem '+o.num+' está "'+statusOrd(o)+'".\n'
      +'Ordens iniciadas ou finalizadas são registro histórico — não podem ser excluídas.');
    return;
  }
  const l = lote(o.lote);
  let msg = 'Excluir a ordem '+o.num+'?';
  if(l && l.status==='Baixado')
    msg += '\n\nATENÇÃO: o lote '+l.id+' já foi BAIXADO pela logística para atender esta ordem.';
  if(!confirm(msg)) return;
  S.ordens = S.ordens.filter(x=>x.id!==id);
  // lote baixado que ficou sem nenhuma ordem: sinaliza devolução ao estoque
  if(l && l.status==='Baixado' && !S.ordens.some(x=>x.lote===l.id)){
    l.devolver = true;
    alert('O lote '+l.id+' ficou BAIXADO SEM NENHUMA ORDEM.\n\n'
      +'Ele foi sinalizado na tela "Lotes a baixar" para a logística devolvê-lo ao estoque (estorno).');
  }
  render();
}

    Use <b>Programar automaticamente</b> para distribuir o pool, ou arraste manualmente.</div>`;

  /* ---- plano semanal (função compartilhada) ---- */
  h += planoSemana('Plano da semana');

  /* ---- seletor de dia + otimizar o dia inteiro ---- */
  const trocasDia = S.maquinas.reduce((a,m)=>a+trocas(cel(m.id)),0);
  h += `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">

  </div>`;

  h += checklistDia(S.diaSel);

  // KPIs do dia
  let progT=0, capTot=0;
  S.maquinas.forEach(m=>{ capTot+=capDia(m.id);
    progT += cel(m.id).reduce((a,o)=>a+pesoT(o),0); });
  const urg = S.ordens.filter(o=>o.prioridade==='Urgente').length;
  const aguard = S.ordens.filter(o=>statusOrd(o)==='Aguardando lote').length;
  h += `<div class="kpis">

    <div class="kpi"><div class="lb">Programado no dia</div><div class="vl">${n(progT,1)} t</div><div class="fo">${n(progT/capTot*100,0)}% da capacidade</div></div>
    <div class="kpi ${aguard?'bad':'ok'}"><div class="lb">Aguardando lote</div><div class="vl">${aguard}</div><div class="fo">ordens travadas no estoque</div></div>
    <div class="kpi ${urg?'mid':''}"><div class="lb">Ordens urgentes</div><div class="vl">${urg}</div><div class="fo">marcadas pelo PCP</div></div>
    <div class="kpi"><div class="lb">Não programadas</div><div class="vl">${naoProg.length}</div><div class="fo">backlog</div></div>
  </div>`;

  // quadro: 1 célula por máquina (dia inteiro)
  h += `<div class="card"><div class="board">
    <div></div>${S.maquinas.map(m=>`<div class="hd">${m.nome} <span class="mut">· ${m.cap} t/h · ${m.tanques} tanques</span></div>`).join('')}`;
  h += `<div class="rot">${dow(S.diaSel)} ${fmtDia(S.diaSel)}<small>07:30 → 03:00</small><small>19,5h · ${n(CAP_TH*19.5,0)} t</small></div>`;
  S.maquinas.forEach(m=>{
    const os = cel(m.id);
    const ton = os.reduce((a,o)=>a+pesoT(o),0);
    const cp = capDia(m.id), pc = ton/cp*100;
    const cl = pc>100?'dng':(pc>85?'warn':'');
    h += `<div class="cell ${pc>100?'cheio':''}" data-m="${m.id}">
      <div class="cap"><span>Ocupação <b>${n(pc,0)}%</b></span>
        <span>${n(ton,1)} / ${n(cp,0)} t</span></div>
      <div class="bar"><i class="${cl}" style="width:${Math.min(100,pc)}%"></i></div>

  return h;
}

    <div class="l3">
      ${o.prioridade==='Urgente'?'<span class="tag t-urg">URGENTE</span>':''}

function selDia(d){ S.diaSel=d; render(); }

/* quadro de ocupação máquina × dia — usado na Programação e na aba Ordens */
function planoSemana(titulo){
  const capDiaM = m => m.cap * S.turnos.reduce((a,t)=>a+t.horas,0); // 234 t
  const naoProg = S.ordens.filter(o=>!o.maq);
  let semTot=0, semCap=0;
  let h = `<div class="card"><h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${titulo}
    <span class="mut" style="font-weight:400;font-size:12px">— ocupação por máquina e dia · clique no dia para abri-lo</span>
    <span style="flex:1"></span>
    <button class="b sm" onclick="moveHorizonte(-1)">‹ semana anterior</button>
    <span class="mut" style="font-size:12px">${fmtDia(DIAS[0])} – ${fmtDia(DIAS[6])}</span>
    <button class="b sm" onclick="moveHorizonte(1)">próxima semana ›</button></h3>
    <table><thead><tr><th>Máquina</th>
    ${DIAS.map(d=>`<th class="num" style="cursor:pointer;${d===S.diaSel?'color:var(--verde)':''}"
      onclick="selDia('${d}')">${dow(d)} ${fmtDia(d)}${d===S.diaSel?' ▾':''}</th>`).join('')}
    <th class="num">Semana</th></tr></thead><tbody>`;
  S.maquinas.forEach(m=>{
    let tot=0;
    h += `<tr><td><b>${m.nome}</b> <span class="mut">cap. ${n(capDiaM(m),0)} t/dia</span></td>`;
    DIAS.forEach(d=>{
      const t = tonDia(m.id,d); tot+=t;
      const pc = t/capDiaM(m)*100;
      h += `<td class="num" style="cursor:pointer" onclick="selDia('${d}')">
        ${t?`<b class="${pc>100?'dv-b':(pc>85?'dv-w':'')}">${n(pc,0)}%</b><br><span class="mut" style="font-size:10.5px">${n(t,0)} t</span>`:'<span class="mut">—</span>'}</td>`;
    });
    semTot+=tot; semCap+=capDiaM(m)*7;
    h += `<td class="num"><b>${n(tot/(capDiaM(m)*7)*100,0)}%</b><br><span class="mut" style="font-size:10.5px">${n(tot,0)} t</span></td></tr>`;
  });
  h += `<tr><td><b>Total</b></td>
    ${DIAS.map(d=>{const t=S.maquinas.reduce((a,m)=>a+tonDia(m.id,d),0);
      const c=S.maquinas.reduce((a,m)=>a+capDiaM(m),0);
      return `<td class="num">${t?`<b class="${t/c>1?'dv-b':''}">${n(t/c*100,0)}%</b><br><span class="mut" style="font-size:10.5px">${n(t,0)} t</span>`:'<span class="mut">—</span>'}</td>`;}).join('')}
    <td class="num"><b>${n(semTot/semCap*100,0)}%</b><br><span class="mut" style="font-size:10.5px">${n(semTot,0)} / ${n(semCap,0)} t</span></td></tr>
    </tbody></table>
    <div class="legend">Backlog (pool, sem dia definido): <b>${naoProg.length} ordem(ns) · ${n(naoProg.reduce((a,o)=>a+pesoT(o),0),1)} t</b>
    — não entram nos totais acima até serem programadas.</div></div>`;
  return h;
}

/* ---- reprogramação (modal) ---- */
function capLinha(o, d, mSel){
  d = d || o.data; mSel = mSel!==undefined ? mSel : o.maq;
  const linhas = S.maquinas.map(m=>{
    const x = ocup(m.id,d);
    const alvo = (m.id===mSel);
    const cls = x.pc>100?'dv-b':(x.pc>85?'dv-w':'');
    return (alvo?'<b>':'')+m.nome+' <span class="'+cls+'">'+n(x.pc,0)+'%</span> ('+n(x.ton,0)+'/'+n(x.c,0)+' t)'+(alvo?'</b>':'');
  }).join(' · ');
  return 'Ocupação em '+dow(d)+' '+fmtDia(d)+': '+linhas;
}
function reabreCap(id){
  const o = S.ordens.find(x=>x.id===id);
  const el = document.getElementById('rpCap'); if(!el) return;
  const d = document.getElementById('rpData').value;
  const m = document.getElementById('rpMaq').value || null;
  let extra = '';
  if(m){
    const x = ocup(m,d);
    const mesmo = (o.maq===m && o.data===d);
    const novo = mesmo ? x.ton : x.ton + pesoT(o);
    const pc = novo/x.c*100;
    if(pc>100){
      const s = sugestao(pesoT(o));
      extra = '<br><span class="dv-b">Com esta ordem: '+n(pc,0)+'% — EXCEDE a capacidade.</span>'+
        (s?' Primeiro encaixe livre: <b>'+dow(s.d)+' '+fmtDia(s.d)+' · '+maq(s.m).nome+'</b> ('+n(s.livre,0)+' t livres).':' Sem espaço livre nos próximos 7 dias.');
    } else if(pc>85) extra = '<br><span class="dv-w">Com esta ordem: '+n(pc,0)+'% — dia quase cheio.</span>';
    else extra = '<br><span class="dv-ok">Com esta ordem: '+n(pc,0)+'% — cabe com folga.</span>';
  }
  el.innerHTML = capLinha(o, d, m) + extra;
}
function reprogramar(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!podeEditar(o)){ alert('O status atual não permite mais edição.'); return; }
  const g = i => document.getElementById(i).value;
  const b = +g('rpBags');
  if(!(b>0)) return alert('Bags deve ser maior que zero.');
  // campos da ordem: lote (=> cultivar/peso), receita, embalagem
  // campo vazio/ausente mantém o valor atual (robustez)
  const lt = g('rpLote')||o.lote, rc = g('rpRec')||o.rec, eb = g('rpEmb')||o.emb;
  if(!lote(lt)) return alert('Lote de semente inválido.');
  const novaCult = lote(lt).cult;
  const cand = {num:o.num, cult:novaCult, rec:rc, emb:eb};
  if(S.ordens.some(x => x!==o && chaveOrd(x)===chaveOrd(cand)))
    return alert('Já existe outra ordem com a mesma chave:\n'
      + o.num+' + '+novaCult+' + '+rec(rc).nome+' + '+eb);
  // AVISO FORTE de demanda também na edição (combinação/quantidade podem ter mudado)
  const anR = analiseDemanda(novaCult, rc, eb, b, o.id);
  if(anR.avisos.length){
    if(!confirm('⚠ AVISO DE DEMANDA — edição da ordem '+o.num+':\n\n'
      + anR.avisos.map(a=>'· '+a).join('\n')
      + '\n\nBalanço: pedido '+anR.b.ped+' · estoque '+anR.b.est
      + ' · planejado (outras) '+anR.b.abertas+' · saldo '+anR.b.saldo+' bg'
      + '\n\nSalvar mesmo assim?')) return;
  }
  const recMudou = (o.rec !== rc);
  o.lote = lt; o.cult = novaCult; o.rec = rc; o.emb = eb;
  o.bags = b; o.obs = g('rpObs').trim();
  // tanques preparados (mas não iniciados) são remontados se a receita mudou
  if(recMudou && !o.eventos.length && o.tanques.length) o.tanques = montaTanques(o);
  const m = g('rpMaq'), d = g('rpData') || o.data;
  if(!m){
    o.maq=null; o.status='Não programada';
  } else {
    const x = ocup(m,d);
    const mesmo = (o.maq===m && o.data===d);
    const novo = mesmo ? x.ton : x.ton + pesoT(o);
    if(novo > x.c){
      const s = sugestao(pesoT(o));
      if(!confirm('Atenção: '+maq(m).nome+' em '+fmtDia(d)+' ficaria com '+Math.round(novo/x.c*100)+'% de ocupação.'
        +(s?'\n\nPrimeiro encaixe livre: '+dow(s.d)+' '+fmtDia(s.d)+' · '+maq(s.m).nome+' ('+Math.round(s.livre)+' t livres).':'')
        +'\n\nProgramar mesmo assim?')) return;
    }
    o.maq=m; o.data=d;
    if(o.status==='Não programada') o.status='Programada';
  }
  reabre(id); render();
}

/* arrastar uma ordem para CIMA de outra: entra na posição dela (empurra para baixo) */
function dropOrdemSobre(dragId, alvoId){
  const o = S.ordens.find(x=>x.id===dragId), t = S.ordens.find(x=>x.id===alvoId);
  if(!o || !t || o===t) return;
  if(['Em produção','Parada'].includes(o.status)){ alert('Ordem em andamento não pode ser reprogramada.'); return; }
  o.maq = t.maq; o.data = t.data;
  if(o.maq && o.status==='Não programada') o.status='Programada';
  if(!o.maq){ render(); return; }               // soltou sobre ordem do pool: volta ao pool
  // ordem desejada: fila atual sem o arrastado, inserindo-o na posição do alvo
  const l = cel(t.maq, t.data).filter(x=>x!==o);
  l.splice(l.indexOf(t), 0, o);
  const seqs = l.map(x=>x.seq).sort((a,b)=>a-b);
  l.forEach((x,i)=>x.seq=seqs[i]);
  // obs.: urgentes continuam agrupadas no topo — soltar uma normal acima de
  // uma urgente reordena apenas dentro do bloco das normais
  render();
}

function moveOrd(id,dir){
  const o = S.ordens.find(x=>x.id===id);
  const l = cel(o.maq,o.data);
  const i = l.indexOf(o), j = i+dir;
  if(j<0 || j>=l.length) return;
  if(l[j].prioridade!==o.prioridade){
    alert('As urgentes ficam agrupadas no topo. Para cruzar o bloco, mude a prioridade da ordem.'); return;
  }
  [o.seq, l[j].seq] = [l[j].seq, o.seq];
  render();
}

// agrupa por prioridade → receita → cultivar, preservando os slots de sequência da célula
function otimiza(m, d, silencioso){
  const l = cel(m, d||S.diaSel);
  if(l.length<2) return;
  const antes = trocas(l);
  const sorted = [...l].sort((a,b)=>
    ((a.prioridade==='Urgente'?0:1)-(b.prioridade==='Urgente'?0:1)) ||
    rec(a.rec).nome.localeCompare(rec(b.rec).nome) ||
    a.cult.localeCompare(b.cult));
  const seqs = l.map(o=>o.seq).sort((a,b)=>a-b);
  sorted.forEach((o,i)=>o.seq=seqs[i]);
  if(!silencioso){
    render();
    alert('Sequência otimizada: '+antes+' → '+trocas(cel(m, d||S.diaSel))+' troca(s) de receita.');
  }
}

/* Otimiza as duas máquinas do dia selecionado de uma vez */
function otimizaDia(){
  const antes = S.maquinas.reduce((a,m)=>a+trocas(cel(m.id)),0);
  S.maquinas.forEach(m=>otimiza(m.id, S.diaSel, true));
  render();
  const depois = S.maquinas.reduce((a,m)=>a+trocas(cel(m.id)),0);
  alert('Sequências do dia otimizadas: '+antes+' → '+depois+' troca(s) de receita.');
}

/* Encaixar (1 clique): melhor slot da semana para esta ordem */
function encaixar(id){
  const o = S.ordens.find(x=>x.id===id);
  const s = melhorSlot(o);
  if(!s){ alert('Sem espaço livre nos próximos 7 dias para '+n(pesoT(o),1)+' t.'); return; }
  o.maq=s.m; o.data=s.d;
  if(o.status==='Não programada') o.status='Programada';
  otimiza(s.m, s.d, true);
  render();
  alert('Ordem '+o.num+' encaixada em '+maq(s.m).nome+' · '+dow(s.d)+' '+fmtDia(s.d)
    +(s.afim===0?' (junto de ordens do mesmo cultivar e tratamento).':s.afim===1?' (junto de ordens do mesmo tratamento).':'.'));
}

/* Programação automática do pool.
   Ordem de alocação: urgentes → lote já baixado → agrupadas por receita+cultivar.
   Alocação: dia mais cedo com espaço; dentro do dia, máquina com afinidade de receita. */
function autoProgramar(){
  const pool = S.ordens.filter(o=>!o.maq);
  if(!pool.length){ alert('Pool vazio — nada a programar.'); return; }
  pool.sort((a,b)=>
    ((a.prioridade==='Urgente'?0:1)-(b.prioridade==='Urgente'?0:1)) ||
    ((lote(a.lote).status==='Baixado'?0:1)-(lote(b.lote).status==='Baixado'?0:1)) ||
    rec(a.rec).nome.localeCompare(rec(b.rec).nome) ||
    a.cult.localeCompare(b.cult) || a.seq-b.seq);
  let okN=0; const sem=[];
  pool.forEach(o=>{
    const s = melhorSlot(o);
    if(s){ o.maq=s.m; o.data=s.d; if(o.status==='Não programada') o.status='Programada'; okN++; }
    else sem.push(o.num);
  });
  DIAS.forEach(d=>S.maquinas.forEach(m=>otimiza(m.id, d, true)));
  render();
  alert(okN+' ordem(ns) programada(s) automaticamente.\n\nCritérios: urgentes primeiro, depois lotes já baixados, '
    +'agrupando cultivar+tratamento na mesma máquina para reduzir setup.'
    +(sem.length?'\n\nSem espaço na semana: '+sem.join(', '):''));
}

/* Rebalancear célula estourada: move as últimas da fila (nunca urgentes,
   nunca iniciadas) para o melhor slot livre */
function rebalancear(m,d){
  const mov=[];
  for(let guard=0; guard<50; guard++){
    const x = ocup(m,d);
    if(x.ton<=x.c) break;
    const l = cel(m,d).filter(o=>podeEditar(o) && o.prioridade!=='Urgente');
    if(!l.length) break;
    const o = l[l.length-1];              // última da fila
    const maqOrig=o.maq; o.maq=null;      // remove para procurar slot
    const s = melhorSlot(o);
    if(!s || (s.m===m && s.d===d)){ o.maq=maqOrig; break; }
    o.maq=s.m; o.data=s.d;
    otimiza(s.m, s.d, true);
    mov.push(o.num+' → '+maq(s.m).nome+' '+dow(s.d)+' '+fmtDia(s.d));
  }
  render();
  alert(mov.length ? 'Rebalanceado — '+mov.length+' ordem(ns) movida(s):\n'+mov.join('\n')
    : 'Não foi possível rebalancear: a célula só tem ordens urgentes/iniciadas, ou não há espaço na semana.');
}

/* Checklist do dia: o que falta para o dia selecionado rodar limpo */
function checklistDia(d){
  const os = S.ordens.filter(o=>o.maq && o.data===d);
  const itens = [];
  const lotesPend = [...new Set(os.filter(o=>lote(o.lote).status==='Em estoque').map(o=>o.lote))];
  if(lotesPend.length){
    const ordsPend = os.filter(o=>lote(o.lote).status==='Em estoque');
    itens.push({grave:true, txt:`<b>${lotesPend.length} lote(s) não baixado(s)</b> — travam ${ordsPend.length} ordem(ns) do dia:
      ${lotesPend.join(', ')}. Acione a logística na aba "Lotes a baixar".`});
  }
  S.maquinas.forEach(m=>{
    const x = ocup(m.id,d);
    if(x.ton>x.c) itens.push({grave:true, txt:`<b>${m.nome} estourada</b>: ${n(x.ton,1)} t programadas para ${n(x.c,0)} t
      de capacidade (${n(x.pc,0)}%). Use o botão Rebalancear na célula.`});
  });
  const pool = S.ordens.filter(o=>!o.maq);
  if(pool.length) itens.push({grave:false, txt:`${pool.length} ordem(ns) no pool (${n(pool.reduce((a,o)=>a+pesoT(o),0),1)} t)
    aguardando programação — Encaixar ou Programar automaticamente.`});
  const urgSemSeq = S.maquinas.some(m=>{ const l=cel(m.id,d); return l.length>1 && trocas(l)>2; });
  if(urgSemSeq) itens.push({grave:false, txt:`Há células com muitas trocas de receita na sequência — vale rodar Otimizar.`});
  if(!itens.length)
    return `<div class="card" style="border-left:4px solid var(--verde)"><h3>Checklist — ${dow(d)} ${fmtDia(d)}</h3>
      <div class="dv-ok" style="font-size:13px">✔ Tudo pronto: lotes baixados, capacidade ok, nada pendente no pool.</div></div>`;
  return `<div class="card" style="border-left:4px solid ${itens.some(i=>i.grave)?'var(--vermelho)':'var(--amarelo)'}">
    <h3>Checklist — o que falta para ${dow(d)} ${fmtDia(d)} rodar</h3>
    ${itens.map(i=>`<div class="alert ${i.grave?'r':''}" style="margin-bottom:7px">${i.txt}</div>`).join('')}</div>`;
}
function tagSt(s){ return {'Aguardando lote':'t-aguard','Pronto para produzir':'t-pronto',
  'Em produção':'t-prod','Parada':'t-parada','Finalizada':'t-fim',
  'Qualidade apontada':'t-fim','Apontada':'t-enc','Não programada':'t-estoque','Programada':'t-estoque'}[s]||'t-estoque'; }

/* drag & drop */
function dragInit(){
  if(!ACOES.programar(S.role)) return;
  let drag=null;
  document.querySelectorAll('.ord').forEach(el=>{
    el.addEventListener('dragstart',e=>{ drag=+el.dataset.id; e.stopPropagation(); });
    // soltar SOBRE outra ordem = assumir a posição dela na sequência
    el.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); el.style.borderTop='3px solid var(--verde)'; });
    el.addEventListener('dragleave',()=>{ el.style.borderTop=''; });
    el.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation(); el.style.borderTop='';
      dropOrdemSobre(drag, +el.dataset.id);
    });
  });
  document.querySelectorAll('.cell').forEach(c=>{
    c.addEventListener('dragover',e=>{e.preventDefault(); c.classList.add('over');});
    c.addEventListener('dragleave',()=>c.classList.remove('over'));
    c.addEventListener('drop',e=>{
      e.preventDefault(); c.classList.remove('over');
      const o = S.ordens.find(x=>x.id===drag); if(!o) return;
      if(['Em produção','Parada'].includes(o.status)){ alert('Ordem em andamento não pode ser reprogramada.'); return; }
      o.maq = c.dataset.m || null;
      if(o.maq){ o.data = S.diaSel; if(o.status==='Não programada') o.status='Programada'; }
      render();
    });
  });
}

/* ============================================================
   2. LOTES A BAIXAR  (Logística / Estoque)
   ============================================================ */
function agregaLotes(){
  return S.lotes.map(l=>{
    const os = S.ordens.filter(o=>o.lote===l.id);
    const prog = os.filter(o=>o.maq);
    return {
      ...l,
      ordens: os, nOrd: os.length,
      pesoT: os.reduce((a,o)=>a+pesoT(o),0),
      bags: os.reduce((a,o)=>a+o.bags,0),
      critico: l.status==='Em estoque' && os.some(o=>o.prioridade==='Urgente'),
      minDia: prog.length ? prog.map(o=>o.data).sort()[0] : '9999-99-99'
    };
  }).sort((a,b)=> (b.critico-a.critico) || a.minDia.localeCompare(b.minDia) || (b.nOrd-a.nOrd));
}
const lotesCriticos = () => agregaLotes().filter(l=>l.critico);

function vLotes(){
  const todos = agregaLotes();
  const ls = todos.filter(l=>l.nOrd>0);          // só lotes com ordens vinculadas pedem ação aqui

  const pend = ls.filter(l=>l.status==='Em estoque');
  let h = `<h2>Lotes a baixar</h2>
    <div class="hint">Visão por lote — como o estoque realmente opera. Baixar um lote libera de uma vez
    todas as ordens que dependem dele. Lotes sem ordem vinculada não aparecem aqui.</div>`;

  if(!ACOES.baixarLote(S.role))
    h += `<div class="rolebox">Você está no perfil <b>${S.role}</b>: esta tela é somente leitura.
      A baixa de lote é feita pelo perfil <b>Logística</b>.</div>`;

  h += `<div class="kpis">
    <div class="kpi ${crit.length?'bad':'ok'}"><div class="lb">Lotes críticos</div><div class="vl">${crit.length}</div><div class="fo">travam ordem urgente</div></div>
    <div class="kpi"><div class="lb">Lotes pendentes</div><div class="vl">${pend.length}</div><div class="fo">de ${ls.length} no total</div></div>
    <div class="kpi"><div class="lb">Peso pendente</div><div class="vl">${n(pend.reduce((a,l)=>a+l.pesoT,0),1)} t</div><div class="fo">a baixar</div></div>
    <div class="kpi"><div class="lb">Ordens travadas</div><div class="vl">${pend.reduce((a,l)=>a+l.nOrd,0)}</div><div class="fo">aguardando lote</div></div>
  </div>`;

  if(crit.length) h += `<div class="alert r"><b>Atenção:</b> ${crit.length} lote(s) crítico(s) —
    ${crit.map(l=>l.id).join(', ')} — estão travando ordens marcadas como urgentes pelo PCP.</div>`;

  ls.forEach(l=>{
    const emUso = ordensIniciadasDoLote(l.id).length>0;
    const borda = l.status==='Baixado' ? 'var(--azul)' : (l.critico ? 'var(--vermelho)' : 'var(--borda)');
    const acao = l.status==='Em estoque'
      ? `<button class="b ${l.critico?'dng':'pri'}" ${ACOES.baixarLote(S.role)?'':'disabled'}
           onclick="baixar('${l.id}')">Baixar lote</button>`
      : ( emUso
          ? `<span class="tag t-prod" title="lote já consumido por ordem iniciada — estorno bloqueado">em uso — sem estorno</span>`
          : `<button class="b" ${ACOES.baixarLote(S.role)?'':'disabled'} onclick="estornar('${l.id}')">Estornar</button>` );
    const ords = [...l.ordens].sort((a,b)=>
      ((a.prioridade==='Urgente'?0:1)-(b.prioridade==='Urgente'?0:1)) ||
      ((a.maq?0:1)-(b.maq?0:1)) || (a.data<b.data?-1:1));
    h += `<div class="card" style="border-left:4px solid ${borda}">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:16px;font-weight:700">${l.id}</span>
        ${l.critico?'<span class="tag t-urg">CRÍTICO — trava ordem urgente</span>':''}
        <span class="tag ${l.status==='Em estoque'?'t-estoque':'t-baixado'}">${l.status}</span>
        <span class="mut">${l.cult} · ${n(l.pesoBag,0)} kg/bag</span>
        <span style="flex:1"></span>
        <span style="font-size:13px;background:var(--verde-cl);border-radius:5px;padding:4px 10px">
          Baixar <b style="font-size:15px">${l.bags} bags</b></span>
        <span class="mut" style="font-size:12px"><b style="color:var(--txt);font-size:14px">${n(l.pesoT,1)} t</b>
          · ${l.nOrd} ordem(ns)${l.minDia!=='9999-99-99'?' · próxima produção: <b>'+dow(l.minDia)+' '+fmtDia(l.minDia)+'</b>':''}</span>
        ${acao}
      </div>
      ${l.nOrd?`<table style="margin-top:10px"><thead><tr>
        <th>Ordem</th><th>Receita</th><th class="num">Bags</th><th class="num">Peso</th>
        <th>Programada para</th><th>Status</th></tr></thead><tbody>
        ${ords.map(o=>{const st=statusOrd(o);
          return `<tr class="${o.prioridade==='Urgente'&&st==='Aguardando lote'?'crit':''}">

        </tbody></table>`:'<div class="mut" style="margin-top:8px;font-size:12px">nenhuma ordem usa este lote</div>'}
    </div>`;
  });
  if(!ls.length) h += `<div class="card mut">Nenhum lote com ordens vinculadas no momento.</div>`;

  // lotes BAIXADOS que ficaram sem nenhuma ordem (ex.: ordens canceladas/excluídas) → devolver ao estoque
  const devolver = semOrd.filter(l=>l.status==='Baixado');
  if(devolver.length){
    h += `<div class="card" style="border-left:4px solid var(--amarelo)">
      <h3>Baixados sem nenhuma ordem — devolver ao estoque</h3>
      <div class="hint" style="margin-bottom:9px">Estes lotes foram baixados, mas as ordens que os usavam
      foram excluídas/canceladas. Estorne para o estoque voltar a bater com a produção.</div>
      <table><thead><tr><th>Lote</th><th>Cultivar</th><th class="num">Peso/bag</th><th></th></tr></thead><tbody>
      ${devolver.map(l=>`<tr><td><b>${l.id}</b></td><td>${l.cult}</td>
        <td class="num">${n(l.pesoBag,0)} kg</td>
        <td class="right"><button class="b warn sm" ${ACOES.baixarLote(S.role)?'':'disabled'}
          onclick="estornar('${l.id}')">Estornar (devolver ao estoque)</button></td></tr>`).join('')}
      </tbody></table></div>`;
  }

  h += relLogistica();

  const soEstoque = semOrd.filter(l=>l.status!=='Baixado');
  h += `<div class="legend"><b>Lote crítico</b> = lote não baixado que trava ao menos uma ordem urgente.
    Ordenação: críticos → dia de produção mais próximo → nº de ordens impactadas.
    ${soEstoque.length?`<br>Em estoque sem ordens vinculadas (fora desta tela): ${soEstoque.map(l=>l.id+' ('+l.cult+')').join(', ')}.`:''}</div>`;
  return h;
}
function baixar(id){
  const l = lote(id);
  l.status='Baixado'; l.baixaPor=S.role; l.baixaEm=new Date();
  const ords = S.ordens.filter(o=>o.lote===id);
  const bags = ords.reduce((a,o)=>a+o.bags,0);
  S.baixas.push({lote:id, bags, peso: bags*l.pesoBag/1000, ts:Date.now(), por:S.role});
  const libs = ords.filter(o=>o.maq).map(o=>o.num);
  render();
  if(libs.length) alert('Lote '+id+' baixado ('+bags+' bags).\n\n'+libs.length+' ordem(ns) liberada(s) para produção:\n'+libs.join(', '));
}
function estornar(id){
  const ini = ordensIniciadasDoLote(id);
  if(ini.length){
    alert('Estorno bloqueado.\n\nO lote '+id+' já foi consumido por ordem(ns) iniciada(s):\n'
      + ini.map(o=>o.num+' — '+statusOrd(o)).join('\n')
      + '\n\nEstornar agora deixaria o estoque inconsistente com a produção.');
    return;
  }
  const l = lote(id);
  const b = [...S.baixas].reverse().find(x=>x.lote===id && x.bags>0);
  if(b) S.baixas.push({lote:id, bags:-b.bags, peso:-b.peso, ts:Date.now(), por:S.role, estorno:true});
  l.status='Em estoque'; delete l.devolver;
  render();
}

        <td class="num ${b.bags<0?'dv-b':''}">${b.bags}</td>
