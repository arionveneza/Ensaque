        <td>${b.estorno?'<span class="tag t-parada">estorno</span>':'<span class="tag t-baixado">baixa</span>'}</td></tr>`).join('')}
      </tbody></table>`;
  } else h += `<div class="mut" style="font-size:12.5px">Nenhuma baixa registrada ainda.</div>`;
  return h + `</div>`;
}

/* ============================================================
   3. EXECUÇÃO  (Produção)
   ============================================================ */
/* card de status de cada máquina (topo da Execução) */
function cardMaq(m){
  const o = ordemNaMaquina(m.id);
  if(!o) return `<div class="kpi">
    <div class="lb">${m.nome}</div>
    <div class="vl" style="font-size:19px;color:var(--verde)">Livre</div>
    <div class="fo">nenhuma ordem em execução · ${m.cap} t/h</div></div>`;
  const T = tempos(o);
  const planS = pesoT(o)/m.cap*3600;                 // tempo total planejado da ordem (s)
  const pAt = o.paradas.find(p=>!p.fim);             // parada em aberto
  const pc = Math.min(100, planS? T.bruto/planS*100 : 0);
  const atrasado = T.bruto > planS;
  return `<div class="kpi" style="border-left:4px solid ${o.status==='Parada'?'var(--vermelho)':'var(--verde)'}">
    <div class="lb">${m.nome} — <span class="tag ${o.status==='Parada'?'t-parada':'t-prod'}">${o.status}</span></div>
    <div style="font-size:15px;font-weight:700;margin-top:5px">${o.num}
      <span class="mut" style="font-size:12px;font-weight:400">· ${o.cult} · ${rec(o.rec).nome} · ${n(pesoT(o),1)} t</span></div>
    <div class="bar" style="margin-top:8px"><i class="${atrasado?'dng':''}" style="width:${n(pc,0)}%"></i></div>
    <div class="info" style="margin-top:9px;grid-template-columns:repeat(2,1fr)">
      <div><span>Tempo planejado (${m.cap} t/h)</span><b class="timer">${hms(planS)}</b></div>
      <div><span>Decorrido</span><b class="timer" ${atrasado?'style="color:var(--vermelho)"':''}>${hms(T.bruto)}</b></div>
      <div><span>Paradas (total)</span><b class="timer">${hms(T.par)}</b></div>
      <div><span>Parada atual</span><b class="timer" style="color:${pAt?'var(--vermelho)':'inherit'}">${pAt?hms((Date.now()-pAt.ini)/1000):'—'}</b></div>
    </div>
    ${pAt?`<div class="fo" style="margin-top:5px">motivo: <b>${motivo(pAt.motivo).desc}</b>
      (${motivo(pAt.motivo).tipo.toLowerCase()})</div>`:''}
  </div>`;
}

function vExec(){
  const os = S.ordens.filter(o=>o.maq).sort((a,b)=>
    (a.data<b.data?-1:a.data>b.data?1:0) || a.maq.localeCompare(b.maq)
    || (a.prioridade==='Urgente'?0:1)-(b.prioridade==='Urgente'?0:1) || a.seq-b.seq);
  let h = `<h2>Execução de ordens</h2>
    <div class="hint">Apontamento por botão. Cada máquina é <b>recurso único</b>: roda uma ordem por vez —
    finalize a atual para iniciar a próxima. Só é possível iniciar ordem com lote baixado.</div>`;
  if(!ACOES.apontar(S.role))
    h += `<div class="rolebox">Perfil <b>${S.role}</b>: leitura. O apontamento de produção é feito pelo perfil <b>Produção</b>.</div>`;

  // cards de status por máquina
  h += `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-bottom:16px">
    ${S.maquinas.map(m=>cardMaq(m)).join('')}</div>`;

  if(!os.length) return h + `<div class="card mut">Nenhuma ordem programada. Verifique a Programação.</div>`;

  h += `<div class="card"><table><thead><tr>
    <th>Ordem</th><th>Turno</th><th>Cultivar / receita</th><th>Lote</th><th class="num">Peso</th>
    <th>Status</th><th class="num">Bruto</th><th class="num">Paradas</th><th class="num">Líquido</th>
    <th>Apontamento</th><th></th></tr></thead><tbody>`;
  let grpDia=null, grpMaq=null;
  os.forEach(o=>{
    if(o.data!==grpDia){ grpDia=o.data; grpMaq=null;
      const doD = os.filter(x=>x.data===grpDia);
      h += `<tr><td colspan="11" style="background:var(--cinza);font-weight:700;font-size:12.5px;padding:7px 9px">
        ${dow(grpDia).toUpperCase()} ${fmtDia(grpDia)}
        <span style="font-weight:400;color:var(--txt2)"> · ${doD.length} ordem(ns) · ${n(doD.reduce((a,x)=>a+pesoT(x),0),1)} t</span></td></tr>`;
    }
    if(o.maq!==grpMaq){ grpMaq=o.maq;
      const doM = os.filter(x=>x.data===grpDia && x.maq===grpMaq);
      const finM = doM.filter(x=>['Finalizada','Qualidade apontada','Apontada'].includes(x.status));
      h += `<tr><td colspan="11" style="background:var(--verde-cl);font-weight:700;font-size:12px;padding:6px 9px 6px 22px">
        ${maq(o.maq).nome}
        <span style="font-weight:400;color:var(--txt2)"> · ${doM.length} ordem(ns) · ${n(doM.reduce((a,x)=>a+pesoT(x),0),1)} t
        · ${finM.length} finalizada(s)</span></td></tr>`;
    }
    const st = statusOrd(o), T = tempos(o);
    const pode = ACOES.apontar(S.role);
    let btns='';
    if(st==='Aguardando lote') btns = `<span class="mut" style="font-size:11.5px">lote ${o.lote} em estoque</span>`;
    else if(st==='Pronto para produzir') btns = `<button class="b pri sm" ${pode?'':'disabled'} onclick="ev(${o.id},'inicio')">▶ Iniciar</button>`;
    else if(st==='Em produção') btns = `<button class="b warn sm" ${pode?'':'disabled'} onclick="abreParada(${o.id})">⏸ Parar</button>
      <button class="b sm" ${pode?'':'disabled'} onclick="ev(${o.id},'fim')">■ Finalizar</button>
      <button class="b sm" ${pode?'':'disabled'} title="começou a ordem errada? descarta os apontamentos e libera a máquina"
        onclick="cancelarInicio(${o.id})">✖ Cancelar início</button>`;
    else if(st==='Parada') btns = `<button class="b pri sm" ${pode?'':'disabled'} onclick="retoma(${o.id})">▶ Retomar</button>
      <button class="b sm" ${pode?'':'disabled'} title="começou a ordem errada? descarta os apontamentos e libera a máquina"
        onclick="cancelarInicio(${o.id})">✖ Cancelar início</button>
      <span class="mut" style="font-size:11.5px">${motivo(o.paradas.find(p=>!p.fim).motivo).desc}</span>`;
    else btns = `<span class="mut" style="font-size:11.5px">encerrado</span>`;
    h += `<tr>
      <td><b>${o.num}</b>${o.prioridade==='Urgente'?' <span class="tag t-urg">URG</span>':''}
        ${o.obs?'<br><span class="tag t-apo" style="font-size:10px">'+o.obs+'</span>':''}</td>
      <td>${o.turno?`<b>T${o.turno}</b><br><span class="mut" style="font-size:11px">${turno(o.turno).ini}–${turno(o.turno).fim}</span>`
        :'<span class="mut" title="atribuído pelo horário do Início">—</span>'}</td>
      <td>${o.cult}<br><span class="mut" style="font-size:12px">${rec(o.rec).nome}</span></td>
      <td><b>${o.lote}</b><br><span class="tag ${lote(o.lote).status==='Baixado'?'t-baixado':'t-estoque'}"
        style="font-size:10px">${lote(o.lote).status}</span></td>
      <td class="num">${o.bags} bg<br><b>${n(pesoT(o),1)} t</b></td>
      <td><span class="tag ${tagSt(st)}">${st}</span></td>
      <td class="num timer">${T.bruto?hms(T.bruto):'—'}</td>
      <td class="num timer">${T.par?hms(T.par):'—'}</td>
      <td class="num timer">${T.liq?hms(T.liq):'—'}</td>
      <td class="nowrap">${btns}</td>
      <td class="right"><button class="b sm" onclick="abreOrd(${o.id})">Abrir</button></td>
    </tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

// máquina é recurso único: ordem em execução (ou parada) na máquina
const ordemNaMaquina = m => S.ordens.find(x=>x.maq===m && ['Em produção','Parada'].includes(x.status));

function ev(id,tipo){
  const o = S.ordens.find(x=>x.id===id);
  if(tipo==='inicio'){
    if(!regra(o,'ini')){ alert('Não é possível iniciar: a ordem está "'+statusOrd(o)+'".'); return; }
    if(lote(o.lote).status==='Em estoque'){ alert('Lote não baixado pelo estoque.'); return; }
    const ocupada = ordemNaMaquina(o.maq);
    if(ocupada){
      alert('Máquina ocupada.\n\n'+maq(o.maq).nome+' já está executando a ordem '+ocupada.num
        +' ('+ocupada.status+').\nCada máquina roda uma ordem por vez — finalize a atual antes de iniciar outra.');
      return;
    }
    // NÃO inicia ainda: prepara os tanques e abre a ordem — o cronômetro só
    // dispara no "Confirmar início", depois dos pesos iniciais preenchidos
    if(!o.tanques.length) o.tanques = montaTanques(o);
    render();
    abreOrd(o.id);
    return;
  }
  if(tipo==='confirma'){ confirmaInicio(id); return; }
  if(tipo==='fim'){
    if(!['Em produção','Parada'].includes(o.status)){
      alert('Só é possível finalizar uma ordem em andamento (status atual: "'+statusOrd(o)+'").');
      return;
    }
    // 1º clique em Finalizar: LIBERA a pesagem final e abre a ordem — não finaliza ainda
    o.fimPend = true;
    render();
    abreOrd(o.id);
    return;
  }
  render();
}

/* Confirma a finalização: pesos finais preenchidos (a pesagem final só é
   liberada depois do clique em Finalizar) */
function confirmaFim(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!['Em produção','Parada'].includes(o.status)){ alert('A ordem não está em andamento.'); return; }
  const semPi = (o.tanques||[]).filter(t=>t.pi==null);
  const semPf = (o.tanques||[]).filter(t=>t.pf==null);
  if(semPi.length || semPf.length){
    alert('Para confirmar a finalização da ordem '+o.num+':\n\n'
      +(semPi.length?'· Peso INICIAL pendente: T'+semPi.map(t=>t.tq).join(', T')+'\n':'')
      +(semPf.length?'· Peso FINAL pendente: T'+semPf.map(t=>t.tq).join(', T')+'\n':''));
    return;
  }
  const ab = o.paradas.find(p=>!p.fim); if(ab) ab.fim=Date.now();
  o.eventos.push({t:'fim', ts:Date.now(), por:S.role});
  o.status='Finalizada'; delete o.fimPend;
  reabre(id); render();
}
/* Cancelar início: o operador começou a ordem errada.
   Descarta os apontamentos de execução (tempos, paradas, tanques, consumos),
   devolve a ordem para "Pronto para produzir" e libera a máquina.
   Fica registrado no histórico da ordem quem cancelou, quando e o que foi descartado. */
function cancelarInicio(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!['Em produção','Parada'].includes(o.status)){
    alert('Só é possível cancelar o início de uma ordem em andamento (status atual: "'+statusOrd(o)+'").');
    return;
  }
  const T = tempos(o);
  if(!confirm('CANCELAR O INÍCIO da ordem '+o.num+'?\n\nSerão descartados:\n'
    +'· '+hms(T.bruto)+' de tempo apontado\n'
    +'· '+o.paradas.length+' parada(s) registrada(s)\n'
    +'· pesos de tanque e lotes de químico lançados\n'
    +'\nA ordem volta para "Pronto para produzir" e a máquina fica livre.\nEsta ação fica registrada no histórico.')) return;
  (o.audit = o.audit || []).push({
    acao:'cancelou o início', por:S.role, em:new Date().toLocaleString('pt-BR'),
    desc:hms(T.bruto)+' e '+o.paradas.length+' parada(s) descartados'
  });
  o.eventos=[]; o.paradas=[]; o.tanques=[]; o.turno=null; delete o.fimPend;
  o.status='Programada';   // statusOrd re-deriva: lote baixado => Pronto para produzir
  render();
}

/* Confirma o início da ordem: pesos iniciais preenchidos + máquina livre + lote baixado */
function confirmaInicio(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!regra(o,'ini')){ alert('Não é possível iniciar: a ordem está "'+statusOrd(o)+'".'); return; }
  if(lote(o.lote).status==='Em estoque'){ alert('Lote não baixado pelo estoque.'); return; }
  const ocupada = ordemNaMaquina(o.maq);
  if(ocupada){
    alert('Máquina ocupada.\n\n'+maq(o.maq).nome+' já está executando a ordem '+ocupada.num
      +' ('+ocupada.status+').'); return;
  }
  const semPi = (o.tanques||[]).filter(t=>t.pi==null);
  // cada PRODUTO de cada tanque precisa ter ao menos um lote de químico informado
  const semLote = [];
  (o.tanques||[]).forEach(t=>t.itens.forEach(it=>{
    const tem = t.lotesQ.some(lq=>{ const x=S.lotesQ.find(y=>y.id===lq); return x && x.q===it.q; });
    if(!tem) semLote.push('T'+t.tq+' — '+quim(it.q).nome);
  }));
  if(semPi.length || semLote.length){
    alert('Para confirmar o início da ordem '+o.num+':\n\n'
      +(semPi.length?'· Peso INICIAL pendente: T'+semPi.map(t=>t.tq).join(', T')+'\n':'')
      +(semLote.length?'· LOTE DE QUÍMICO pendente:\n   '+semLote.join('\n   ')+'\n':'')
      +'\nSem o lote de cada produto não há rastreabilidade do tratamento.');
    return;
  }
  o.eventos.push({t:'inicio', ts:Date.now(), por:S.role});
  o.turno = turnoAgora();
  o.status = 'Em produção';
  reabre(id); render();
}

function abreParada(id){
  const o = S.ordens.find(x=>x.id===id);
  document.getElementById('modT').textContent = 'Registrar parada — ordem '+o.num;
  document.getElementById('modB').innerHTML = `
    <div class="hint">Cada motivo é classificado como <b>planejada</b> ou <b>não planejada</b> — é isso que separa
    tempo normal de processo (setup, limpeza) de perda real no indicador de disponibilidade.</div>
    <div class="sec"><div class="sh">Motivo da parada</div><div class="sb">
      ${['Planejada','Não planejada'].map(tp=>`
        <h3 style="margin-top:6px">${tp} <span class="tag ${tp==='Planejada'?'t-plan':'t-nplan'}">${tp}</span></h3>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">
        ${S.motivos.filter(m=>m.tipo===tp).map(m=>
          `<button class="b" onclick="para(${o.id},'${m.id}')">${m.desc}</button>`).join('')}
        </div>`).join('')}
    </div></div>`;
  document.getElementById('ov').classList.add('on');
}
function para(id,mot){
  const o = S.ordens.find(x=>x.id===id);
  o.paradas.push({motivo:mot, ini:Date.now(), fim:null, por:S.role});
  o.status='Parada'; fecha(); render();
}
function retoma(id){
  const o = S.ordens.find(x=>x.id===id);
  const p = o.paradas.find(p=>!p.fim); if(p) p.fim=Date.now();
  o.status='Em produção'; render();
}

/* ---------- modal da ordem: tanques, 3 consumos, lacres ---------- */
function abreOrd(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!o) return;
  document.getElementById('modT').textContent = 'Ordem '+o.num+' — '+o.cult;
  document.getElementById('modB').innerHTML = ordHTML(o);
  document.getElementById('ov').classList.add('on');
}

function fecha(){ document.getElementById('ov').classList.remove('on'); }

          <tr><td>Apontar qualidade</td><td>${regra(o,'qual')?'<span class="dv-ok">permitido</span>':'bloqueado'}</td></tr>
        </tbody></table>
        <div class="legend">Edição é permitida apenas nos status: ${EDITAVEIS.join(' · ')}.</div>
      </div></div>`;
    }
  }

  // tempos
  h += `<div class="sec"><div class="sh">Tempos e lead time</div><div class="sb">
    <div class="info">
      <div><span>Tempo bruto (fim − início)</span><b class="timer">${hms(T.bruto)}</b></div>
      <div><span>Paradas planejadas</span><b class="timer">${hms(T.pPlan)}</b></div>
      <div><span>Paradas não planejadas</span><b class="timer">${hms(T.pNao)}</b></div>
      <div><span>Tempo líquido</span><b class="timer" style="color:var(--verde)">${hms(T.liq)}</b></div>
      <div><span>Disponib. bruta</span><b>${T.bruto?n(T.liq/T.bruto*100,0)+'%':'—'}</b></div>
      <div><span>Disponib. operacional</span><b>${T.bruto?n(T.liq/Math.max(1,T.bruto-T.pPlan)*100,0)+'%':'—'}</b></div>
      <div><span>Rendimento</span><b>${T.liq?n(pesoT(o)/(T.liq/3600),1)+' t/h':'—'}</b></div>
      <div><span>Lead time</span><b class="timer">${hms(T.lead)}</b></div>
    </div>
    <div class="legend" style="margin-top:9px">
      <b>Disponib. bruta</b> = tempo líquido ÷ tempo bruto — % do tempo em que a máquina realmente produziu,
      contando TODA parada como perda (inclusive setup e refeição).
      <b>Disponib. operacional</b> = tempo líquido ÷ (tempo bruto − paradas planejadas) — desconta as paradas
      que são parte normal do processo (setup, limpeza, refeição) e mostra só a perda real (quebras, faltas).
      Ex.: 1h de ordem com 10min de setup e 20min de quebra → bruta 50%, operacional 60%.</div>`;
  if(o.paradas.length){
    h += `<h3 style="margin-top:13px">Paradas registradas</h3><table><thead><tr>
      <th>Motivo</th><th>Tipo</th><th>Início</th><th>Fim</th><th class="num">Duração</th></tr></thead><tbody>`;
    o.paradas.forEach(p=>{ const m=motivo(p.motivo);
      h += `<tr><td>${m.desc}</td><td><span class="tag ${m.tipo==='Planejada'?'t-plan':'t-nplan'}">${m.tipo}</span></td>
        <td>${new Date(p.ini).toLocaleTimeString('pt-BR')}</td>
        <td>${p.fim?new Date(p.fim).toLocaleTimeString('pt-BR'):'<i>em curso</i>'}</td>
        <td class="num timer">${hms(((p.fim||Date.now())-p.ini)/1000)}</td></tr>`; });
    h += `</tbody></table>`;
  }
  h += `</div></div>`;

  // tanques: receita executada, mistura, lotes de químico (N por tanque), Real vs Planejado
  h += `<div class="sec"><div class="sh">Receita executada — pesos de balança por tanque (Real vs Planejado)</div><div class="sb">`;
  if(!o.tanques.length){
    h += `<div class="mut" style="font-size:12.5px">Os tanques são carregados ao iniciar a ordem.
      Receita ${rec(o.rec).nome}: ${rec(o.rec).itens.length} produto(s) em ${new Set(rec(o.rec).itens.map(i=>i.tq)).size} tanque(s).</div>`;
  } else {
    const cts = consumosTq(o);
    const pre = st==='Pronto para produzir';                       // pesos iniciais ANTES do início
    const rodando = ['Em produção','Parada'].includes(o.status);
    if(pre)
      h += `<div class="alert r"><b>A ordem ainda NÃO foi iniciada.</b> Informe o peso INICIAL de cada tanque
        e o <b>lote de químico de cada produto</b>, depois clique em <b>Confirmar início</b>.
        Fechar esta janela não inicia a ordem.</div>`;
    else if(rodando && o.fimPend)
      h += `<div class="alert r"><b>Finalização em andamento.</b> Informe o peso FINAL de cada tanque
        e clique em <b>Confirmar finalização</b>. Fechar esta janela não finaliza a ordem.</div>`;
    else if(rodando)
      h += `<div class="alert"><b>Peso final travado:</b> ele é liberado ao clicar em <b>Finalizar</b> —
        a pesagem final acontece no fim da produção, não durante.</div>`;
    h += `<table><thead><tr><th>Tq</th><th>Produto(s) — dose · densidade</th><th style="min-width:200px">Lote(s) do químico</th>
      <th class="num">Planejado (kg)</th><th class="num">Peso inicial (kg)</th><th class="num">Peso final (kg)</th>
      <th class="num">Real (kg)</th><th class="num">Desvio</th></tr></thead><tbody>`;
    cts.forEach((t,i)=>{
      const mistura = t.itens.length>1;
      // lotes organizados POR PRODUTO: cada linha mostra o produto, seus lotes e um seletor próprio
      const celLotes = t.itens.map(it=>{
        const q = quim(it.q);
        const meus = t.lotesQ.filter(lq=>{ const x=S.lotesQ.find(y=>y.id===lq); return x && x.q===it.q; });
        const disp = S.lotesQ.filter(x=>x.q===it.q && !t.lotesQ.includes(x.id));
        return `<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:3px 0;
            ${mistura?'border-bottom:1px dashed var(--borda)':''}">
          <span class="mut" style="font-size:11px;white-space:nowrap">${q.nome}:</span>
          ${meus.map(lq=>`<span class="tag t-baixado">${lq}${pode?` <a style="cursor:pointer;font-weight:700"
            title="remover" onclick="delLoteTq(${o.id},${i},'${lq}')">✕</a>`:''}</span>`).join('')}
          ${meus.length?'':'<span class="tag t-aguard" style="font-size:10px">sem lote</span>'}
          ${pode&&disp.length?`<select style="font-size:11px;padding:2px 4px;max-width:130px"
            onchange="addLoteTq(${o.id},${i},this.value)">
            <option value="">+ lote…</option>
            ${disp.map(x=>`<option value="${x.id}">${x.id}</option>`).join('')}</select>`:''}
        </div>`;
      }).join('');
      h += `<tr class="${t.dv!=null&&Math.abs(t.dv)>LIM_DESVIO?'crit':''}">
        <td><b>T${t.tq}</b>${mistura?'<br><span class="tag t-apo" style="font-size:10px">MISTURA</span>':''}</td>
        <td>${t.itens.map(it=>{const q=quim(it.q);
          return q.nome+' <span class="mut">'+n(it.dose,2)+' '+q.un+(q.dens?' · d='+n(q.dens,2)+' g/ml':'')+'</span>';}).join('<br>')}</td>
        <td>${celLotes}</td>
        <td class="num"><b>${n(t.plan,1)}</b>${t.vol?`<br><span class="mut" style="font-size:11px">${n(t.vol,1)} L</span>`:''}</td>
        <td class="num"><input class="w90 num" type="number" step="0.1" value="${t.pi??''}"
          ${pode&&(pre||rodando)?'':'disabled'} onchange="setTq(${o.id},${i},'pi',this.value)"></td>
        <td class="num"><input class="w90 num" type="number" step="0.1" value="${t.pf??''}"
          ${pode&&rodando&&o.fimPend?'':'disabled'}
          ${!o.fimPend?'placeholder="no Finalizar"':''}
          onchange="setTq(${o.id},${i},'pf',this.value)"></td>
        <td class="num"><b>${t.real!=null?n(t.real,1):'—'}</b></td>
        <td class="num ${clsDv(t.dv)}">${fmtDv(t.dv)}</td></tr>`;
    });
    const totPlan = cts.reduce((a,t)=>a+t.plan,0);
    const totReal = cts.every(t=>t.real!=null) ? cts.reduce((a,t)=>a+t.real,0) : null;
    h += `<tr><td colspan="3"><b>Total químico da ordem</b></td>
      <td class="num"><b>${n(totPlan,1)}</b></td><td></td><td></td>
      <td class="num"><b>${totReal!=null?n(totReal,1):'—'}</b></td>
      <td class="num ${clsDv(totReal!=null?(totReal-totPlan)/totPlan*100:null)}">${totReal!=null?fmtDv((totReal-totPlan)/totPlan*100):'—'}</td></tr>
      </tbody></table>
      <div class="legend"><b>Planejado (balança)</b> = dose × peso da semente × densidade (ml/kg) ou dose × peso (g/kg) ·
      <b>Real</b> = peso inicial − peso final do tanque · alerta acima de ±${LIM_DESVIO}% ·
      tanque com MISTURA compara contra a soma dos produtos · use "+ lote…" para registrar mais de um lote de químico.</div>
      ${pre&&pode?`<div style="margin-top:12px;text-align:right">
        <button class="b pri" style="font-size:14px;padding:9px 18px" onclick="confirmaInicio(${o.id})">
        ▶ Confirmar início da ordem</button></div>`:''}
      ${rodando&&o.fimPend&&pode?`<div style="margin-top:12px;text-align:right">
        <button class="b dng" style="font-size:14px;padding:9px 18px" onclick="confirmaFim(${o.id})">
        ■ Confirmar finalização da ordem</button></div>`:''}`;
  }
  h += `</div></div>`;

  // qualidade
  h += `<div class="sec"><div class="sh">Qualidade</div><div class="sb">${qualForm(o)}</div></div>`;

  // encerramento: lançamento no AGROTIS (ação do PCP, após a qualidade)
  if(st==='Qualidade apontada' || st==='Apontada'){
    h += `<div class="sec"><div class="sh">Encerramento — lançamento no AGROTIS</div><div class="sb">`;
    if(st==='Apontada'){
      h += `<div class="info">
        <div><span>Status</span><b><span class="tag t-enc">APONTADA</span></b></div>
        <div><span>Nº do lançamento AGROTIS</span><b>${o.agrotis.num}</b></div>
        <div><span>Apontada por</span><b>${o.agrotis.por}</b></div>
        <div><span>Em</span><b>${o.agrotis.em}</b></div></div>`;
    } else if(ACOES.agrotis(S.role)){
      h += `<div class="hint" style="margin-bottom:9px">A ordem passou pela qualidade. Lance-a no AGROTIS e
        registre aqui o número do lançamento — isso ENCERRA a ordem (nenhuma edição depois).</div>
        <div class="fl">
          <div class="fld"><label>Nº do lançamento no AGROTIS *</label>
            <input class="w110" style="width:180px" id="agN" placeholder="ex. AG-2026-0157"></div>
          <button class="b pri" onclick="apontarAgrotis(${o.id})">✔ Confirmar APONTADA</button>
        </div>`;
    } else {
      h += `<div class="mut" style="font-size:12.5px">Aguardando o PCP lançar no AGROTIS e apontar aqui
        (perfis PCP/Gestor).</div>`;
    }
    h += `</div></div>`;
  }
  return h;
}

/* Encerramento: PCP lançou no AGROTIS e registra o apontamento — status final */
function apontarAgrotis(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!ACOES.agrotis(S.role)){ alert('Apenas PCP/Gestor apontam o lançamento no AGROTIS.'); return; }
  if(statusOrd(o)!=='Qualidade apontada'){
    alert('Só é possível apontar após a qualidade (status atual: "'+statusOrd(o)+'").'); return;
  }
  const nl = document.getElementById('agN').value.trim();
  if(!nl){ alert('Informe o número do lançamento no AGROTIS.'); return; }
  o.agrotis = {num:nl, por:S.role, em:new Date().toLocaleString('pt-BR')};
  (o.audit=o.audit||[]).push({acao:'apontou no AGROTIS', por:S.role,
    em:o.agrotis.em, desc:'lançamento '+nl});
  o.status = 'Apontada';
  reabre(id); render();
}

/* pesos de balança e lotes de químico por tanque
   (controle de lacres foi descontinuado — não é mais utilizado) */
function setTq(id,i,k,v){ const o=S.ordens.find(x=>x.id===id);
  o.tanques[i][k] = (v===''?null:+v); reabre(id); }
function addLoteTq(id,i,v){ if(!v) return;
  const o=S.ordens.find(x=>x.id===id);
  if(!o.tanques[i].lotesQ.includes(v)) o.tanques[i].lotesQ.push(v);
  reabre(id); }
function delLoteTq(id,i,val){ const o=S.ordens.find(x=>x.id===id);
  o.tanques[i].lotesQ = o.tanques[i].lotesQ.filter(x=>x!==val); reabre(id); }
function togglePri(id){ const o=S.ordens.find(x=>x.id===id);
  if(!regra(o,'pri')){
    alert('Prioridade bloqueada: a ordem está "'+statusOrd(o)+'" — priorizar não tem mais efeito.');
    return;
  }
  o.prioridade = o.prioridade==='Urgente'?'Normal':'Urgente';
  o.priPor=S.role; o.priEm=new Date(); reabre(id); render(); }

/* ============================================================
   4. QUALIDADE
   ============================================================ */
function qualForm(o){
  const pode = ACOES.qualidade(S.role), q = o.qual;
  if(!['Finalizada','Qualidade apontada','Apontada'].includes(o.status) && !q)
    return `<div class="mut" style="font-size:12.5px">O apontamento de qualidade é liberado após a ordem ser finalizada.</div>`;
  if(q && !pode)
    return `<div class="info"><div><span>Qualidade visual</span><b><span class="tag ${tagQ(q.visual)}">${q.visual}</span></b></div>
      <div><span>Retirada de amostra</span><b>${q.amostra?'Sim':'Não'}</b></div>
      <div><span>Inspetor</span><b>${q.por}</b></div>
      <div><span>Observação</span><b>${q.obs||'—'}</b></div></div>`;
  return `<div class="fl">
    <div class="fld"><label>Qualidade visual do tratamento</label>
      <select id="qV"><option ${q&&q.visual==='Aprovado'?'selected':''}>Aprovado</option>
        <option ${q&&q.visual==='Aprovado com observação'?'selected':''}>Aprovado com observação</option>
        <option ${q&&q.visual==='Reprovado'?'selected':''}>Reprovado</option></select></div>
    <div class="fld"><label>Houve retirada de amostra?</label>
      <select id="qA"><option value="1" ${q&&q.amostra?'selected':''}>Sim</option>
        <option value="0" ${q&&!q.amostra?'selected':''}>Não</option></select></div>
    <div class="fld" style="flex:1;min-width:220px"><label>Observação</label>
      <input id="qO" value="${q?(q.obs||''):''}" placeholder="opcional"></div>
    <button class="b pri" ${pode?'':'disabled'} onclick="salvaQual(${o.id})">Salvar apontamento</button>
  </div>${pode?'':'<div class="legend">Somente o perfil Qualidade pode apontar.</div>'}`;
}
const tagQ = v => ({'Aprovado':'t-ap','Aprovado com observação':'t-apo','Reprovado':'t-rep'})[v];
function salvaQual(id){
  const o = S.ordens.find(x=>x.id===id);
  if(!regra(o,'qual')){
    alert('Qualidade só pode ser apontada em ordem finalizada (status atual: "'+statusOrd(o)+'").');
    return;
  }
  o.qual = {visual:document.getElementById('qV').value,
            amostra:document.getElementById('qA').value==='1',
            obs:document.getElementById('qO').value, por:S.role, em:new Date()};
  o.status='Qualidade apontada';
  reabre(id); render();
}

function vQual(){
  const os = S.ordens.filter(o=>['Finalizada','Qualidade apontada','Apontada'].includes(o.status));
  let h = `<h2>Qualidade do processo / produto</h2>
    <div class="hint">Por ordem: qualidade visual do tratamento (Aprovado / Aprovado com observação / Reprovado)
    e se houve retirada de amostra.</div>`;
  if(!ACOES.qualidade(S.role))
    h += `<div class="rolebox">Perfil <b>${S.role}</b>: leitura. O apontamento é feito pelo perfil <b>Qualidade</b>.</div>`;
  const pend = os.filter(o=>!o.qual).length;
  h += `<div class="kpis">
    <div class="kpi"><div class="lb">Ordens finalizadas</div><div class="vl">${os.length}</div></div>
    <div class="kpi ${pend?'mid':'ok'}"><div class="lb">Aguardando qualidade</div><div class="vl">${pend}</div></div>
    <div class="kpi ok"><div class="lb">Aprovadas</div><div class="vl">${os.filter(o=>o.qual&&o.qual.visual==='Aprovado').length}</div></div>
    <div class="kpi bad"><div class="lb">Reprovadas</div><div class="vl">${os.filter(o=>o.qual&&o.qual.visual==='Reprovado').length}</div></div>
  </div>`;
  if(!os.length) return h + `<div class="card mut">Nenhuma ordem finalizada ainda. Vá em <b>Execução</b>,
    inicie e finalize uma ordem para liberar o apontamento de qualidade.</div>`;
  h += `<div class="card"><table><thead><tr><th>Ordem</th><th>Cultivar / receita</th><th>Máq/T</th>
    <th>Qualidade visual</th><th>Amostra</th><th>Inspetor</th><th>Observação</th><th></th></tr></thead><tbody>`;
  os.forEach(o=>{
    h += `<tr><td><b>${o.num}</b></td><td>${o.cult}<br><span class="mut" style="font-size:12px">${rec(o.rec).nome}</span></td>
      <td>${maq(o.maq).nome}${o.turno?'/T'+o.turno:''}</td>
      <td>${o.qual?`<span class="tag ${tagQ(o.qual.visual)}">${o.qual.visual}</span>`:'<span class="tag t-aguard">pendente</span>'}</td>
      <td>${o.qual?(o.qual.amostra?'Sim':'Não'):'—'}</td>
      <td>${o.qual?o.qual.por:'—'}</td><td class="mut">${o.qual?(o.qual.obs||'—'):'—'}</td>
      <td class="right"><button class="b sm" onclick="abreOrd(${o.id})">Apontar</button></td></tr>`;
  });
  return h + `</tbody></table></div>`;
}

/* ============================================================
   5. INDICADORES
   ============================================================ */
function vInd(){
  const fin = S.ordens.filter(o=>tempos(o).bruto>0);
  let h = `<h2 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">Indicadores de produção
    <span style="flex:1"></span>
    <button class="b" onclick="expProducao()">⬇ Exportar produção (.xlsx)</button></h2>
    <div class="hint">Dia de produção 07:30 → 03:00. Turno 1 = apontamentos até 17:30 · Turno 2 = 17:30 às 03:00.</div>`;

  // por máquina (dia selecionado)
  h += `<div class="card"><h3>Produção por máquina — ${dow(S.diaSel)} ${fmtDia(S.diaSel)}</h3><table><thead><tr>
    <th>Máquina</th><th class="num">Capacidade/dia</th><th class="num">Programado</th>
    <th class="num">Ocupação</th><th class="num">Produzido</th><th class="num">Ordens</th></tr></thead><tbody>`;
  S.maquinas.forEach(m=>{
    const os = cel(m.id), cp = capDia(m.id);
    const prog = os.reduce((a,o)=>a+pesoT(o),0);
    const prod = os.filter(o=>['Finalizada','Qualidade apontada','Apontada'].includes(o.status))
                   .reduce((a,o)=>a+pesoT(o),0);
    const pc = prog/cp*100;
    h += `<tr><td><b>${m.nome}</b></td>
      <td class="num">${n(cp,0)} t</td><td class="num">${n(prog,1)} t</td>
      <td class="num ${pc>100?'dv-b':(pc>85?'dv-w':'dv-ok')}">${n(pc,0)}%</td>
      <td class="num">${n(prod,1)} t</td><td class="num">${os.length}</td></tr>`;
  });
  h += `</tbody></table>
  <h3 style="margin-top:14px">Produção por turno <span class="mut" style="font-weight:400;font-size:11.5px">
    — turno real, atribuído pelo horário do Início (até 17:30 = T1)</span></h3>
  <table><thead><tr><th>Turno</th><th>Janela</th><th class="num">Ordens iniciadas</th>
    <th class="num">Produzido</th></tr></thead><tbody>
  ${S.turnos.map(t=>{
    const osT = S.ordens.filter(o=>o.turno===t.id && o.eventos.some(e=>e.t==='inicio'));
    const prodT = osT.filter(o=>['Finalizada','Qualidade apontada','Apontada'].includes(o.status))
                     .reduce((a,o)=>a+pesoT(o),0);
    return `<tr><td><b>${t.nome}</b></td><td class="mut">${t.ini} – ${t.fim}</td>
      <td class="num">${osT.length}</td><td class="num">${n(prodT,1)} t</td></tr>`;
  }).join('')}
  </tbody></table></div>`;

  // tempos
  if(fin.length){
    const tot = fin.reduce((a,o)=>{const T=tempos(o);
      return {b:a.b+T.bruto, pp:a.pp+T.pPlan, pn:a.pn+T.pNao, l:a.l+T.liq};},{b:0,pp:0,pn:0,l:0});
    h += `<div class="kpis">
      <div class="kpi"><div class="lb">Tempo bruto</div><div class="vl timer" style="font-size:19px">${hms(tot.b)}</div></div>
      <div class="kpi"><div class="lb">Paradas planejadas</div><div class="vl timer" style="font-size:19px">${hms(tot.pp)}</div><div class="fo">setup, limpeza, refeição</div></div>
      <div class="kpi bad"><div class="lb">Paradas não planejadas</div><div class="vl timer" style="font-size:19px">${hms(tot.pn)}</div><div class="fo">perda real</div></div>
      <div class="kpi ok"><div class="lb">Tempo líquido</div><div class="vl timer" style="font-size:19px">${hms(tot.l)}</div></div>
      <div class="kpi"><div class="lb">Disponib. bruta</div><div class="vl">${n(tot.l/tot.b*100,0)}%</div><div class="fo">líquido ÷ bruto</div></div>
      <div class="kpi"><div class="lb">Disponib. operacional</div><div class="vl">${n(tot.l/Math.max(1,tot.b-tot.pp)*100,0)}%</div><div class="fo">desconta paradas planejadas</div></div>
    </div>`;

    // pareto de paradas
    const agg = {};
    S.ordens.forEach(o=>o.paradas.forEach(p=>{
      const m = motivo(p.motivo), d = ((p.fim||Date.now())-p.ini)/1000;
      agg[m.id] = agg[m.id] || {desc:m.desc, tipo:m.tipo, s:0, n:0};
      agg[m.id].s += d; agg[m.id].n++;
    }));
    const arr = Object.values(agg).sort((a,b)=>b.s-a.s), mx = arr[0]?arr[0].s:1;
    h += `<div class="card"><h3>Pareto de paradas — planejadas vs não planejadas</h3>`;
    if(!arr.length) h += `<div class="mut" style="font-size:12.5px">Nenhuma parada registrada. Vá em Execução, inicie uma ordem e clique em Parar.</div>`;
    arr.forEach(a=>{
      h += `<div class="pareto"><div class="nm">${a.desc}<br>
        <span class="tag ${a.tipo==='Planejada'?'t-plan':'t-nplan'}" style="font-size:10px">${a.tipo}</span></div>
        <div class="pb"><i style="width:${a.s/mx*100}%;background:${a.tipo==='Planejada'?'var(--azul)':'var(--vermelho)'}"></i></div>
        <div class="vv timer">${hms(a.s)}</div><div class="vv mut">${a.n}×</div></div>`;
    });
    h += `<div class="legend">Sem essa classificação o setup penalizaria a disponibilidade como se fosse falha —
      e a perda real ficaria escondida.</div></div>`;

    // relatório de produção por ordem: início/fim, planejado vs realizado, produtividade
    h += `<div class="card"><h3>Relatório de produção por ordem
      <span class="mut" style="font-weight:400;font-size:11.5px">— tempo planejado (peso ÷ ${CAP_TH} t/h) vs realizado bruto e líquido</span></h3>
      <table><thead><tr><th>Ordem</th><th>Máq/T</th><th class="num">Peso</th>
      <th>Início</th><th>Fim</th>
      <th class="num">Plan.</th><th class="num">Bruto</th><th class="num">vs plan</th>
      <th class="num">Líquido</th><th class="num">vs plan</th>
      <th class="num">Parado</th><th class="num">Prod. bruta</th><th class="num">Prod. líquida</th>
      <th>Qualidade</th></tr></thead><tbody>`;
    fin.forEach(o=>{ const T=tempos(o);
      const ini=o.eventos.find(e=>e.t==='inicio'), fim=o.eventos.find(e=>e.t==='fim');
      const plan = pesoT(o)/maq(o.maq).cap*3600;
      const vsB = T.bruto/plan*100, vsL = T.liq/plan*100;
      h += `<tr><td><b>${o.num}</b></td><td>${maq(o.maq).nome}${o.turno?'/T'+o.turno:''}</td>
        <td class="num">${n(pesoT(o),1)} t</td>
        <td class="nowrap">${ini?new Date(ini.ts).toLocaleTimeString('pt-BR').slice(0,5):'—'}</td>
        <td class="nowrap">${fim?new Date(fim.ts).toLocaleTimeString('pt-BR').slice(0,5):'—'}</td>
        <td class="num timer">${hms(plan)}</td>
        <td class="num timer">${hms(T.bruto)}</td>
        <td class="num ${vsB>110?'dv-b':(vsB>100?'dv-w':'dv-ok')}">${n(vsB,0)}%</td>
        <td class="num timer">${hms(T.liq)}</td>
        <td class="num ${vsL>110?'dv-b':(vsL>100?'dv-w':'dv-ok')}">${n(vsL,0)}%</td>
        <td class="num timer">${hms(T.par)}</td>
        <td class="num">${T.bruto?n(pesoT(o)/(T.bruto/3600),1)+' t/h':'—'}</td>
        <td class="num">${T.liq?n(pesoT(o)/(T.liq/3600),1)+' t/h':'—'}</td>
        <td>${o.qual?`<span class="tag ${tagQ(o.qual.visual)}">${o.qual.visual}</span>`:'<span class="mut">—</span>'}</td></tr>`;
    });
    h += `</tbody></table></div>`;

    // produção por período (dia / semana / mês / geral) com tempo parado
    const finTodas = S.ordens.filter(o=>['Finalizada','Qualidade apontada','Apontada'].includes(o.status));
    const porDia = {};
    finTodas.forEach(o=>{ const T=tempos(o);
      const g = porDia[o.data] = porDia[o.data]||{ton:0,n:0,bruto:0,par:0,liq:0};
      g.ton+=pesoT(o); g.n++; g.bruto+=T.bruto; g.par+=T.par; g.liq+=T.liq; });
    const dias = Object.keys(porDia).sort();
    const somaDesde = iso => dias.filter(d=>d>=iso).reduce((a,d)=>({
      ton:a.ton+porDia[d].ton, n:a.n+porDia[d].n, bruto:a.bruto+porDia[d].bruto,
      par:a.par+porDia[d].par, liq:a.liq+porDia[d].liq}), {ton:0,n:0,bruto:0,par:0,liq:0});
    const sem7 = somaDesde(addD(S.dia,-6));
    const mes0 = S.dia.slice(0,8)+'01';
    const mesA = somaDesde(mes0);
    const geral = somaDesde('0000-00-00');
    h += `<div class="card"><h3>Produção por período <span class="mut" style="font-weight:400;font-size:11.5px">
      — inclui tempo parado por dia, semana e mês</span></h3>
      <table><thead><tr><th>Período</th><th class="num">Ordens</th><th class="num">Produzido</th>
      <th class="num">Tempo bruto</th><th class="num">Tempo parado</th><th class="num">Tempo líquido</th>
      <th class="num">Prod. líquida</th></tr></thead><tbody>
      ${dias.map(d=>{const g=porDia[d];
        return `<tr><td>${dow(d)} ${fmtDia(d)}</td><td class="num">${g.n}</td>
        <td class="num"><b>${n(g.ton,1)} t</b></td>
        <td class="num timer">${hms(g.bruto)}</td><td class="num timer">${hms(g.par)}</td>
        <td class="num timer">${hms(g.liq)}</td>
        <td class="num">${g.liq?n(g.ton/(g.liq/3600),1)+' t/h':'—'}</td></tr>`;}).join('')}
      <tr style="border-top:2px solid var(--borda)"><td><b>Semana (últimos 7 dias)</b></td>
        <td class="num">${sem7.n}</td><td class="num"><b>${n(sem7.ton,1)} t</b></td>
        <td class="num timer">${hms(sem7.bruto)}</td><td class="num timer">${hms(sem7.par)}</td>
        <td class="num timer">${hms(sem7.liq)}</td>
        <td class="num">${sem7.liq?n(sem7.ton/(sem7.liq/3600),1)+' t/h':'—'}</td></tr>
      <tr><td><b>Mês corrente</b></td>
        <td class="num">${mesA.n}</td><td class="num"><b>${n(mesA.ton,1)} t</b></td>
        <td class="num timer">${hms(mesA.bruto)}</td><td class="num timer">${hms(mesA.par)}</td>
        <td class="num timer">${hms(mesA.liq)}</td>
        <td class="num">${mesA.liq?n(mesA.ton/(mesA.liq/3600),1)+' t/h':'—'}</td></tr>
      <tr><td><b>Geral</b></td>
        <td class="num">${geral.n}</td><td class="num"><b>${n(geral.ton,1)} t</b></td>
        <td class="num timer">${hms(geral.bruto)}</td><td class="num timer">${hms(geral.par)}</td>
        <td class="num timer">${hms(geral.liq)}</td>
        <td class="num">${geral.liq?n(geral.ton/(geral.liq/3600),1)+' t/h':'—'}</td></tr>
      </tbody></table></div>`;
  } else {
    h += `<div class="card mut">Nenhum apontamento de tempo ainda. Vá em <b>Execução</b> (perfil Produção),
      inicie uma ordem, registre uma parada e finalize — os indicadores se preenchem sozinhos.</div>`;
  }
  return h;
}

/* ============================================================
   6. CADASTROS
   ============================================================ */
function vCad(){
  let h = `<h2>Cadastros</h2><div class="hint">Base do sistema. No protótipo são somente leitura.</div>`;

  h += `<div class="card"><h3>Máquinas e capacidade</h3><table><thead><tr><th>Máquina</th>
    <th class="num">Capacidade</th><th class="num">Tanques</th><th class="num">Cap. Turno 1 (10h)</th>
    <th class="num">Cap. Turno 2 (9h30)</th><th class="num">Cap. dia</th></tr></thead><tbody>
    ${S.maquinas.map(m=>`<tr><td><b>${m.nome}</b></td><td class="num">${m.cap} t/h</td>
      <td class="num">${m.tanques}</td><td class="num">${n(m.cap*10,0)} t</td>
      <td class="num">${n(m.cap*9.5,0)} t</td><td class="num"><b>${n(m.cap*19.5,0)} t</b></td></tr>`).join('')}
    </tbody></table></div>`;

  h += `<div class="card"><h3>Turnos</h3><table><thead><tr><th>Turno</th><th>Início</th><th>Fim</th>
    <th class="num">Horas</th><th>Regra de atribuição</th></tr></thead><tbody>
    <tr><td><b>Turno 1</b></td><td>07:30</td><td>17:30</td><td class="num">10,0</td>
      <td class="mut">turno não é programado: é atribuído pelo horário real do Início (até 17:30 = T1)</td></tr>
    <tr><td><b>Turno 2</b></td><td>17:30</td><td>03:00 (+1d)</td><td class="num">9,5</td>
      <td class="mut">cruza a meia-noite; pertence ao dia de produção que começou às 07:30</td></tr>
    </tbody></table></div>`;

  h += `<div class="card"><h3>Embalagens</h3><table><thead><tr><th>Código</th><th>Descrição</th>
    <th class="num">Sementes</th></tr></thead><tbody>
    ${S.embalagens.map(e=>`<tr><td><b>${e.cod}</b></td><td>${e.desc}</td>
      <td class="num">${e.sem.toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div>`;

  h += `<div class="card"><h3>Produtos químicos</h3><table><thead><tr><th>Produto</th>
    <th>Unidade de dose</th><th class="num">Densidade (g/ml)</th><th>Lotes disponíveis</th></tr></thead><tbody>
    ${S.quimicos.map(q=>`<tr><td><b>${q.nome}</b></td><td>${q.un}</td>
      <td class="num">${q.dens?n(q.dens,2):'<span class="mut">— (dose já em peso)</span>'}</td>
      <td class="mut">${S.lotesQ.filter(l=>l.q===q.id).map(l=>l.id).join(', ')||'—'}</td></tr>`).join('')}
    </tbody></table>
    <div class="legend">A densidade converte a dose (ml/kg) em <b>peso de balança</b> — é o valor que a produção
    usa para aferir a balança dos tanques. A receita continua definida por dose.</div></div>`;

  h += `<div class="card"><h3>Receitas de tratamento</h3>
    <div class="hint">A dose define o VOLUME; a densidade converte em PESO DE BALANÇA — que é o valor
    usado na aferição dos tanques nas ordens.</div>`;
  S.receitas.forEach(r=>{
    h += `<h3 style="margin-top:12px">${r.nome}</h3><table><thead><tr><th>Tanque</th><th>Produto</th>
      <th class="num">Dose</th><th class="num">Densidade</th>
      <th class="num">Volume p/ 40 t</th><th class="num">Peso balança p/ 40 t</th></tr></thead><tbody>
      ${r.itens.map(i=>{const q=quim(i.q);
        const vol = i.dose*40000/1000;                                  // L (ml/kg) ou kg (g/kg)
        const peso = q.un==='ml/kg' ? vol*(q.dens||1) : vol;            // kg de balança
        return `<tr><td>T${i.tq}</td><td>${q.nome}</td>
        <td class="num">${n(i.dose,2)} ${q.un}</td>
        <td class="num">${q.dens?n(q.dens,2)+' g/ml':'<span class="mut">—</span>'}</td>
        <td class="num">${q.un==='ml/kg'?n(vol,1)+' L':'<span class="mut">—</span>'}</td>
        <td class="num"><b>${n(peso,1)} kg</b></td></tr>`;}).join('')}
      </tbody></table>`;
  });
  h += `</div>`;

  h += `<div class="card"><h3>Motivos de parada</h3><table><thead><tr><th>Motivo</th><th>Tipo</th>
    <th>Efeito no indicador</th></tr></thead><tbody>
    ${S.motivos.map(m=>`<tr><td>${m.desc}</td>
      <td><span class="tag ${m.tipo==='Planejada'?'t-plan':'t-nplan'}">${m.tipo}</span></td>
      <td class="mut" style="font-size:12px">${m.tipo==='Planejada'
        ?'descontada da disponibilidade operacional':'contabilizada como perda real'}</td></tr>`).join('')}
    </tbody></table></div>`;

  h += `<div class="card"><h3>Lotes de semente <span class="mut" style="font-weight:400;font-size:12px">
    — importados da planilha de lotes; o peso é resolvido por busca no nº do lote</span></h3>
    <table><thead><tr><th>Lote</th><th>Cultivar</th><th class="num">Peso/bag</th><th>Status</th>
    <th class="num">Ordens</th></tr></thead><tbody>
    ${S.lotes.map(l=>{
      const nOrd = S.ordens.filter(o=>o.lote===l.id).length;
      const orfao = l.status==='Baixado' && nOrd===0;
      return `<tr><td><b>${l.id}</b></td><td>${l.cult}</td><td class="num">${n(l.pesoBag,0)} kg</td>
      <td><span class="tag ${l.status==='Baixado'?'t-baixado':'t-estoque'}">${l.status}</span>
        ${orfao?'<span class="tag t-apo" title="baixado mas sem nenhuma ordem — devolver ao estoque na tela Lotes a baixar">⚠ sem ordens — estornar</span>':''}</td>
      <td class="num ${orfao?'dv-b':''}">${nOrd}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  return h;
}

/* ============================================================ */
document.getElementById('hDia').textContent = '27/07/2026';
render();
// auto-refresh dos timers: SÓ na tela de Execução e com modal fechado —
// nas demais telas re-renderizar apagaria o que o usuário está digitando
setInterval(()=>{ if(view==='exec' && S.ordens.some(o=>['Em produção','Parada'].includes(o.status))){
  if(!document.getElementById('ov').classList.contains('on')) render(); } }, 1000);
</script>
